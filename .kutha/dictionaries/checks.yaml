      - kind: file_contains
        path: crates/kutha-runtime/dictionaries/relations.yaml
        needles: ["schema: kutha-relations/v1", "inForceAs", "knows", "knownBy", "runStatus", "observed", "processAllows"]
        require: all
        category: allowlist
        message: "relation dictionary missing {missing}"

  - id: toolchain
    description: harness is Python >=3.13 under uv with ruff+ty+pyrefly
    steps:
      - kind: file_equals
        path: .python-version
        equals: "3.13"
        category: python-pin
        message: ".python-version must be 3.13, found {found!r}"
      - kind: file_exists
        path: .env.example
      - kind: file_contains
        path: .env.example
        needles:
          - "KUTHA_GOV_BUDGET="
          - "KUTHA_GOV_FAIL_ON_WARN="
          - "KUTHA_MAX_CASCADE="
          - "KUTHA_GOV_CARGO_TIMEOUT_SEC="
          - "KUTHA_TENANT_DIR="
          - "KUTHA_HARNESS_LOG="
          - "KUTHA_TENANT_TIMEOUT_SEC="
          - "KUTHA_HARNESS_RELATIONS_PATH="
          - "KUTHA_TENANT_BIN="
          - "debug/kutha-migrate"
