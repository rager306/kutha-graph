  - id: docs-entry
    description: human and Claude Code entry files exist and CLAUDE.md shims AGENTS.md
    steps:
      - kind: file_exists
        path: README.md
        stop_on_fail: true
      - kind: file_exists
        path: CLAUDE.md
        stop_on_fail: true
      - kind: file_contains
        path: CLAUDE.md
        needles: ["@AGENTS.md"]
        require: all
        category: entry
        message: "CLAUDE.md must shim AGENTS.md"

  - id: state-readme
    description: README shows the same Active Milestone and Phase as STATE
    selftest:
      mutations:
        # README must show STATE's Phase (Milestone may be None and is skip_values).
        - op: replace_regex
          path: README.md
          pattern: 'H5'
          with: "H9"
    steps:
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*(?P<id>M\d+[a-z]?|None)\s*$'
        flags: [multiline]
        other: README.md
        skip_values: ["None"]
        label: Active Milestone
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Phase:\*\*\s*(?P<id>H\d+|None)\s*$'
        flags: [multiline]
        other: README.md
        skip_values: ["None"]
        label: Phase

  - id: version-freeze
    description: research-stage versions stay 0.0.0 until STATE names a release
    steps:
      - kind: file_contains
        path: Cargo.toml
        needles: ['version = "0.0.0"']
        require: all
        category: version-freeze
        message: "workspace version must stay 0.0.0 until STATE names a release"
      - kind: file_contains
        path: pyproject.toml
        needles: ['version = "0.0.0"']
        require: all
        category: version-freeze
        message: "harness version must stay 0.0.0 until STATE names a release"
      - kind: file_absent
        path: Cargo.toml
        needles: ["publish = true"]
        category: version-freeze
        message: "crates stay publish = false at 0.0.0"

  - id: changelog-planes
    description: CHANGELOG keeps product/process/Trajectory distinct and is not a GitHub Release
    steps:
      - kind: file_exists
        path: CHANGELOG.md
        stop_on_fail: true
      - kind: file_contains
        path: CHANGELOG.md
        needles: ["not GitHub Releases", "product", "process", "Trajectory"]
        require: all
        category: changelog-planes
        message: "CHANGELOG.md missing plane legend: {missing}"

  - id: docs-coupling
    description: plane-bearing git diffs must include the owning docs (pre-commit / auto worktree)
    selftest:
      skip: "depends on the live git diff"
    steps:
      - kind: git_path_implies
        when_any: ["crates/**/*.rs"]
        then_any: ["CHANGELOG.md"]
        message: "product crate diff without CHANGELOG.md (product plane)"
      - kind: git_path_implies
        when_any:
          - "scripts/kutha_gov/**"
          - "scripts/tests/**"
          - ".kutha/dictionaries/**"
          - ".kutha/META.md"
          - "docs/process/**"
        then_any: ["CHANGELOG.md"]
        message: "harness diff without CHANGELOG.md (process plane)"
      - kind: git_path_implies
        when_any: ["docs/ADR/**/*.md"]
        then_any: ["CHANGELOG.md"]
        message: "ADR diff without CHANGELOG.md (L_map / Trajectory)"
      - kind: git_path_implies
        when_any: [".kutha/STATE.md"]
        then_any: ["README.md"]
        message: "STATE.md diff without README.md (human lease table)"
      - kind: git_path_implies
        when_any: [".kutha/STATE.md"]
        then_any: ["CHANGELOG.md"]
        message: "STATE.md lease diff without CHANGELOG.md (process plane)"
      - kind: git_path_implies
        when_any: [".kutha/STATE.md"]
        then_any: [".kutha/ROADMAP.md"]
        message: "STATE.md lease diff without .kutha/ROADMAP.md (lease bundle)"
      - kind: git_path_implies
        when_any: ["docs/architecture/**"]
        then_any: ["CHANGELOG.md"]
        message: "architecture note diff without CHANGELOG.md (Trajectory)"
      - kind: git_path_implies
        when_any: ["docs/ADR/**/*.md"]
        then_any: [".kutha/dictionaries/honeycomb.yaml"]
        message: "ADR diff without honeycomb.yaml (L_map index)"
      - kind: git_path_implies
        when_any: [".kutha/dictionaries/checks.yaml"]
        then_any:
          - ".kutha/dictionaries/invariants.yaml"
          - ".kutha/dictionaries/bridges.yaml"
        message: "checks.yaml diff without invariants.yaml or bridges.yaml (control loop / bridge ledger)"

  - id: invariants-ledger
    description: control-loop claims get an explicit process disposition; not a Kutha requirements catalog
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/invariants.yaml
        stop_on_fail: true
      - kind: file_exists
        path: docs/process/governor-intake.md
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/invariants.yaml
        needles:
          - "schema: kutha-harness-invariants/v1"
          - "disposition: check"
          - "disposition: deferred"
        require: all
        category: intake
        message: "invariants.yaml missing schema or control-loop disposition vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/invariants.yaml
        needles:
          - "disposition: capability"
          - "disposition: map-only"
          - "docs/ADR/ADR-"
        category: intake
        message: "invariants.yaml copied L_map/L_capability into the control loop: {needle}"
      - kind: file_contains
        path: docs/process/governor-intake.md
        needles:
          - "Silence is not a requirement"
          - "disposition: check"
          - "Do not add `scripts/kutha_gov/checks/*.py`"
          - "Bridges may cite"
          - "control loop"
          - "Kutha requirements stay"
        require: all
        category: intake
        message: "governor-intake.md missing protocol clauses: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        require_fields: [id, claim, source, disposition]
        message: "invariants.yaml rows missing id/claim/source/disposition: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        unique: id
        message: "invariants.yaml duplicate id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        field: disposition
        allowed: [check, kind, deferred]
        message: "invariants.yaml unknown disposition: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        require_fields: [check]
        message: "disposition=check rows missing check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        unique: check
        message: "disposition=check rows share a check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: deferred
        require_fields: [until]
        message: "disposition=deferred rows missing until: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: kind
        require_fields: [kind]
        message: "disposition=kind rows missing kind name: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        field: check
        other: .kutha/dictionaries/checks.yaml
        prefix: "  - id: "
        message: "control-loop check ids missing from checks.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        field: check
        other: .kutha/dictionaries/bridges.yaml
        prefix: "    check: "
        absent_other: true
        message: "control-loop check ids also listed as bridges: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/checks.yaml
        select: checks
        field: id
        other:
          - .kutha/dictionaries/invariants.yaml
          - .kutha/dictionaries/bridges.yaml
        prefix: "    check: "
        message: "checks.yaml ids missing a control-loop or bridge ledger row: {missing}"

  - id: bridges-ledger
    description: bridges cite product freeze or tests; they do not copy Kutha requirements into the harness
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/bridges.yaml
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/bridges.yaml
        needles:
          - "schema: kutha-harness-bridges/v1"
          - "cites:"
        require: all
        category: bridge
        message: "bridges.yaml missing schema or cites vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/bridges.yaml
        needles:
          - "disposition:"
          - "disposition: map-only"
          - "disposition: capability"
        category: bridge
        message: "bridges.yaml copied control-loop dispositions: {needle}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        require_fields: [id, claim, cites, check]
        message: "bridges.yaml rows missing id/claim/cites/check: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        unique: id
        message: "bridges.yaml duplicate id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        unique: check
        message: "bridges.yaml duplicate check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        field: check
        other: .kutha/dictionaries/checks.yaml
        prefix: "  - id: "
        message: "bridge check ids missing from checks.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        field: check
        other: .kutha/dictionaries/invariants.yaml
        prefix: "    check: "
        absent_other: true
        message: "bridge check ids also listed in the control-loop ledger: {missing}"

  - id: honeycomb-ledger
    description: L_map compact index stays fail-closed; not a delivery backlog and not product dictionaries
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/honeycomb.yaml
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/honeycomb.yaml
        needles:
          - "schema: kutha-map-honeycomb/v1"
          - "delivery: spike"
          - "delivery: frozen"
          - "delivery: map-only"
          - "capability: none"
          - "capability: named"
        require: all
        category: map
        message: "honeycomb.yaml missing schema or stage vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/honeycomb.yaml
        needles:
          - "disposition: check"
          - "promote all"
        category: map
        message: "honeycomb.yaml mixed into control-loop or backlog: {needle}"
      - kind: glob_paths_in_file
        glob: docs/ADR/ADR-*.md
        path: .kutha/dictionaries/honeycomb.yaml
        prefix: "    path: "
        message: "ADR files missing from honeycomb.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: locks
        require_fields: [id, must, path]
        unique: id
        message: "honeycomb locks missing id/must/path: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        require_fields: [id, axis, must, path, map, delivery, capability]
        require_list_fields: [depends_on, locks, evidence]
        unique: id
        message: "honeycomb cells missing required fields: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: path
        must_exist: true
        message: "honeycomb cell paths do not exist: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: map
        allowed: [Research, Proposed, Deprecated, Superseded]
        message: "honeycomb map status not in ADR vocab (Accepted is Nygard, not this ledger): {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: delivery
        allowed: [map-only, frozen, spike]
        message: "honeycomb unknown delivery stage: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: capability
        allowed: [none, named]
        message: "honeycomb unknown capability stage: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: axis
        allowed: [Time, Space, Composition, Data, Agent, Verify, Query, Security, Vertical, Packaging]
        message: "honeycomb unknown axis: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: map
        in_path_field: path
        prefix: "**"
        suffix: "**"
        message: "honeycomb map status missing from ADR Status: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        when:
          delivery: frozen
        require_fields: [freeze_as]
        message: "frozen cells missing freeze_as: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        when:
          delivery: frozen
        field: freeze_as
        other: .kutha/STATE.md
        prefix: ""
        message: "freeze_as needles missing from STATE freeze: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        when:
          capability: named
        nonempty_list: evidence
        message: "capability=named cells missing evidence tests: {missing}"
      - kind: rust_test_asserts
        names_from_yaml:
          path: .kutha/dictionaries/honeycomb.yaml
          select: cells
          field: evidence
          glob: "crates/**/*.rs"
        require_evidence_when:
          field: capability
          equals: named
        category: map
        message: "honeycomb evidence names missing as asserting #[test]: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        list_field: depends_on
        other: .kutha/dictionaries/honeycomb.yaml
        prefix: "  - id: "
        message: "depends_on ids missing from honeycomb cells: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        list_field: locks
        other: .kutha/dictionaries/honeycomb.yaml
        prefix: "  - id: "
        message: "lock ids missing from honeycomb locks: {missing}"

  - id: cite-lease
    description: >-
      Docs that write a concrete L_delivery=, L_map=, L_capability=, or
      Active Milestone M### token must match the STATE assignment.
      Lifecycle capture is KEY= plus an alphanumeric token
      ([A-Za-z0-9][A-Za-z0-9._-]*). Empty `L_delivery=` and placeholders such as
      `L_delivery=<lease>` are not cites (token-format prose and AGENTS.md
      "Read STATE.md" stay silent). A concrete token, including one inside
      backticks, is a cite — stale L_delivery=M011-S03-done is HIGH.
      Active Milestone cites are status phrasing (is/stays/colon), not
      "names M002" thaw language. CHANGELOG.md is out of scope. `.planning/`
      is out of scope except PROJECT.md.
    selftest:
      mutations:
        - op: append_text
          path: .planning/PROJECT.md
          text: "\nActive Milestone: M015\n"
    steps:
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: AGENTS.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: README.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: STRATEGY.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/process/*.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/architecture/*.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: docs/ADR/README.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^L_map=([A-Za-z0-9][A-Za-z0-9._-]*)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: AGENTS.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: README.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: STRATEGY.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/process/*.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/architecture/*.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: docs/ADR/README.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: AGENTS.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: README.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: STRATEGY.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/process/*.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/architecture/*.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: docs/ADR/README.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^\*\*Active Milestone:\*\*\s*(M\d{3}[a-z]?|None)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: AGENTS.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: README.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: STRATEGY.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - glob: docs/process/*.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - glob: docs/architecture/*.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: docs/ADR/README.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: .kutha/ROADMAP.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: .kutha/ROADMAP.md
            pattern: '(?m)^## (M\d{3}[a-z]?):[^\n]*\bACTIVE\b'
          - path: .kutha/ROADMAP.md
            pattern: '\*\*(M\d{3}[a-z]?)\*\*\s+—\s+ACTIVE'

  - id: refs-resolve
    description: >-
      ADR-NNN and D1-D10 citations in AGENTS.md, README.md, .kutha markdown,
      dictionary YAML, and docs/process must resolve. Ranges (en dash or hyphen)
      contribute both endpoints, not the interior. ADR-XXX (non-digit) is ignored.
      Leading-zero forms D010-1 and D050-2 are honeycomb sub-decisions, not lock
      ids. ADR-100 may dangle (frozen do-not-open). CHANGELOG and .planning are
      out of scope.
    steps:
      - kind: refs_resolve
        paths:
          - AGENTS.md
          - README.md
        globs:
          - .kutha/**/*.md
          - .kutha/dictionaries/*.yaml
          - docs/process/*.md
        allow_dangling:
          - ADR-100

  - id: agents-lean
    description: >-
      AGENTS.md line count is wc -l and must stay at or under 110 (Phase 9
      result was 100). file_absent forbids lease assignment tokens
      L_delivery=, L_map=, L_capability=, and the sentence M011 is active.
    steps:
      - kind: file_max_lines
        path: AGENTS.md
        max: 110
      - kind: file_absent
        path: AGENTS.md
        needles:
          - "L_delivery="
          - "L_map="
          - "L_capability="
          - "M011 is active"

  - id: kinds-lean
    description: >-
      kinds.py line count is wc -l and must stay at or under 2500 (post-split
      band was ~2292; CE 2026-10-15 testing gap / M126). Prevents unbounded
      kernel re-growth; new kind policy stays in sibling modules.
    steps:
      - kind: file_max_lines
        path: scripts/kutha_gov/kinds.py
        max: 2500
        message: "kinds.py has {n} lines (wc -l), max {max} — split policy into sibling modules"

  - id: selftest-lean
    description: >-
      selftest.py line count is wc -l and must stay at or under 1000 (M127).
      Twin of kinds-lean for the selftest prove plane.
    steps:
      - kind: file_max_lines
        path: scripts/kutha_gov/selftest.py
        max: 1000
        message: "selftest.py has {n} lines (wc -l), max {max} — split derive helpers out"

  - id: artifact-budget
    description: >-
      Live-phase planning artifacts (v0.06 onward, including v0.07/v0.08)
      stay within declared line and per-directory file budgets (D-02, D-04).
    selftest:
      skip: "no live .planning/phases CONTEXT"
      skip_unless_glob: .planning/phases/*-*/*-CONTEXT.md
    steps:
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-PLAN.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        correspond_glob: .planning/phases/*-*/*-CONTEXT.md
        correspond_skip_if: "*-VERIFICATION.md"
        max: 150
        max_files_per_dir: 2
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-SUMMARY.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        max: 60
        max_files_per_dir: 1
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        max: 60
        max_files_per_dir: 1
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-CONTEXT.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        max: 80
        max_files_per_dir: 1

  - id: verification-independent
    description: >-
      Live-phase VERIFICATION files must not list plan or summary artifact paths
      and must carry independence frontmatter (D-05). When live CONTEXT exists,
      missing VERIFICATION is HIGH (CE review P1 #16); idle without CONTEXT skips.
    selftest:
      skip: >-
        selftest copy drops tmp/, .planning/milestones, and .compound-engineering
        cited by archived phase VERIFICATION read_only_inputs; CE #16 idle/live
        contract is proved by VerificationIndependentTests
    steps:
      - kind: glob_absent
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        needles:
          - "-PLAN.md"
          - "-SUMMARY.md"
      - kind: file_contains
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        needles: ["independent: true", "verifier_model", "commands:", "read_only_inputs:", "exit:"]
        require: all
      - kind: frontmatter_paths_exist
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        field: read_only_inputs

  - id: id-map-cite
    description: >-
      One Id map table lives in docs/process/gsd-auto-contract.md; both
      ROADMAPs link to § Id map and must not restate the table header (D-06).
    steps:
      - kind: file_contains
        path: docs/process/gsd-auto-contract.md
        needles: ["## Id map", "GSD version", "v0.06", "v0.07", "v0.08", "v0.09", "v0.12", "v0.13", "v0.16", "v0.17"]
        require: all
      - kind: file_contains
        path: .planning/ROADMAP.md
        needles: ["docs/process/gsd-auto-contract.md", "Id map"]
        require: all
      - kind: file_contains
        path: .kutha/ROADMAP.md
        needles: ["docs/process/gsd-auto-contract.md", "Id map"]
        require: all
      - kind: file_absent
        path: .planning/ROADMAP.md
        needles: ["| GSD version | Phases | Harness"]
      - kind: file_absent
        path: .kutha/ROADMAP.md
        needles: ["| GSD version | Phases | Harness"]

  - id: product-close-gate
    description: >-
      Product close checklist names workspace cargo tests and full ci;
      precommit alone is not a product close gate (M022 Phase 72 lesson).
    steps:
      - kind: file_contains
        path: docs/process/gsd-auto-contract.md
        needles:
          - "cargo test --workspace --offline --no-fail-fast"
          - "uv run kutha-gov ci"
          - "`precommit` alone is not a product close gate"
        require: all
    selftest:
      mutations:
        - op: replace_regex
          path: docs/process/gsd-auto-contract.md
          pattern: "`precommit` alone is not a product close gate"
          with: "`precommit` is enough for product close"

  - id: stub-ci-honest-name
    description: >-
      Pytest full-quantum with stub cargo must not be named as live-tree green
      (CE review P1 #7). Live observe remains kutha-gov ci / KUTHA_LIVE_CARGO.
    steps:
      - kind: glob_absent
        glob: scripts/tests/test_kutha_gov.py
        needles:
          - "def test_ci_green_on_this_tree("
        category: oracle
        message: "stubbed CI quantum still uses lying name test_ci_green_on_this_tree"
      - kind: file_contains
        path: scripts/tests/test_kutha_gov.py
        needles:
          - "def test_ci_fsm_reaches_ok_with_stubbed_observe"
          - "KUTHA_LIVE_CARGO"
        require: all
        category: oracle
        message: "stub-scoped FSM test or live cargo opt-in missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/tests/test_kutha_gov.py
          pattern: "def test_ci_fsm_reaches_ok_with_stubbed_observe"
          with: "def test_ci_green_on_this_tree"

  - id: disk-free
    description: >-
      Fail closed when free disk under the repo filesystem is below YAML
      min_free_gib (protects heavy ci/cargo from mid-wave ENOSPC).
    steps:
      - kind: disk_free
        path: "."
        min_free_gib: 2
        category: disk-free
        message: "{path} has {free_gib:.2f} GiB free; min_free_gib={min_free_gib}"

  - id: budget-template-align
    description: >-
      .env.example KUTHA_GOV_BUDGET must equal fsm.yaml defaults.budget so a
      copied .env cannot silently truncate the check tail (M058 residual).
    steps:
      - kind: cite_equals
        source:
          path: .kutha/dictionaries/fsm.yaml
          pattern: '(?m)^  budget:\s*(\d+)\s*$'
        cites:
          - path: .env.example
            pattern: '(?m)^KUTHA_GOV_BUDGET=(\d+)\s*$'
        message: "{path} cites KUTHA_GOV_BUDGET={got} but {source} defaults.budget is {expected}"

  - id: budget-covers-checks
    description: >-
      fsm.yaml defaults.budget must be at least the dictionary check count so
      Cui cannot truncate the tail (precommit gate; complements ci truncation HIGH).
    steps:
      - kind: budget_covers_checks
        message: "defaults.budget={budget} covers {n} checks incompletely (short by {short})"

  - id: env-budget-floor
    description: >-
      Live KUTHA_GOV_BUDGET when set must be ≥ fsm.yaml defaults.budget so a
      stale .env cannot truncate only on ci (precommit runs the full dictionary).
    steps:
      - kind: env_int_at_least
        env: KUTHA_GOV_BUDGET
        at_least:
          path: .kutha/dictionaries/fsm.yaml
          pattern: '(?m)^  budget:\s*(\d+)\s*$'
        message: "{env}={got} is below fsm defaults.budget={floor}"

  - id: verification-uv-only
    description: >-
      VERIFICATION command records invoke kutha-gov via uv (CE whole-repo #35).
      Ambient python/-m replay can select the wrong interpreter.
    steps:
      - kind: glob_absent
        glob: ".planning/**/*VERIFICATION.md"
        needles:
          - "python -m kutha_gov"
          - "python3 -m kutha_gov"
        category: oracle
        message: "VERIFICATION still records ambient python kutha_gov: {needle}"
    selftest:
      mutations:
        # Selftest copy drops `.planning/milestones/`; mutate a living phase VERIFICATION.
        - op: replace_regex
          path: .planning/phases/126-norm-view-derived-correct/126-VERIFICATION.md
          pattern: "uv run kutha-gov ci"
          with: "python -m kutha_gov ci"

  - id: statute-fixture-single-lang
    description: >-
      Statute fixture punkt_15_1.txt stays single-language (CE whole-repo #36).
      English metadata belongs outside the payload file.
    steps:
      - kind: file_absent
        path: crates/kutha-runtime/fixtures/statute/punkt_15_1.txt
        needles:
          - "law-nexus"
          - "ADR-090"
          - "test data only"
        category: oracle
        message: "statute fixture mixes English metadata into payload: {needle}"
      - kind: file_contains
        path: crates/kutha-runtime/fixtures/statute/punkt_15_1.txt
        needles: ["15.1", "2028"]
        require: all
        category: oracle
        message: "statute fixture missing required payload tokens: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: crates/kutha-runtime/fixtures/statute/punkt_15_1.txt
          pattern: "(пункт 15\\.1 действует до 01\\.01\\.2028)"
          with: "\\1\n(law-nexus syn-001 / C01 quote — test data only; not an ADR-090 pack thaw)"

  - id: parallel-check-error-parity
    description: >-
      check.run exceptions are check-error under jobs=1 and jobs>1; worker-error
      is reserved for transport failures (CE review P2 #23). M137: behavioral
      worker oracle — not docstring/assert text needles.
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/parallel.py
        needles:
          - "return eval_check(check, ctx)"
        require: all
        category: oracle
        message: "parallel worker missing shared eval_check exception path: {missing}"
      - kind: file_contains
        path: scripts/tests/test_jobs.py
        needles:
          - "test_eval_check_worker_maps_run_exception_to_check_error"
          - "test_mini_tree_check_raise_is_check_error_jobs_1_and_2"
        require: all
        category: oracle
        message: "parallel check-error parity oracle missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/parallel.py
          pattern: "return eval_check\\(check, ctx\\)"
          with: "return check.run(ctx)"

  - id: observe-skipped-breadcrumb
    description: >-
      Suppressed observe_cargo leaves a LOW observe-skipped finding naming state
      and cause; observation uses allowlisted cargo (CE review P2 #39).
      M142: fsm wiring + pytest name — not assert-snippet needles. Matrix SEM-m142.
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/fsm.py
        needles:
          - "def _note_observe_skipped"
          - '"observe-skipped"'
          - 'outcome.observations.append(("cargo", "skipped"))'
        require: all
        category: oracle
        message: "observe-skipped breadcrumb missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - "def test_second_observe_cargo_notes_skip_after_prior_high"
        require: all
        category: oracle
        message: "observe-skipped oracle missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/fsm.py
          pattern: 'outcome.observations.append\(\("cargo", "skipped"\)\)'
          with: 'outcome.observations.append(("cargo", "ok"))'

  - id: parallel-context-flags
    description: >-
      Parallel worker Context carries skip_emit and changed_paths from the caller
      (CE review P2 #48). M141: wiring + worker pytest — not docstring/assert-snippet
      needles. Matrix SEM-m141.
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/parallel.py
        needles:
          - "skip_emit=skip_emit"
          - "changed_paths=changed_paths"
          - "ctx.skip_emit"
          - "ctx.changed_paths"
        require: all
        category: oracle
        message: "parallel Context flag plumbing missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_jobs.py
        needles:
          - "def test_eval_check_worker_propagates_skip_emit_and_changed_paths"
        require: all
        category: oracle
        message: "parallel Context flag oracle missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/parallel.py
          pattern: "skip_emit=skip_emit,"
          with: "skip_emit=False,"

  - id: cargo-observe-lock
    description: >-
      observe_cargo holds an exclusive flock on CARGO_TARGET_DIR/.kutha-gov-cargo.lock
      so concurrent cargo/bench cannot race to exit 101 (M114 / SEM-m114-cargo-observe-lock).
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/observe.py
        needles:
          - "_exclusive_cargo_lock"
          - ".kutha-gov-cargo.lock"
          - "KUTHA_GOV_CARGO_LOCK_WAIT_SEC"
        require: all
        category: oracle
        message: "cargo observe flock needles missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_m114_cargo_observe_lock.py
        needles:
          - "def test_observe_times_out_when_cargo_lock_held"
          - "def test_concurrent_observe_does_not_overlap_stub"
        require: all
        category: oracle
        message: "M114 cargo lock pytest missing: {missing}"
      - kind: file_contains
        path: .env.example
        needles:
          - "KUTHA_GOV_CARGO_LOCK_WAIT_SEC"
        require: all
        category: oracle
        message: ".env.example missing cargo lock wait: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/observe.py
          pattern: "\\.kutha-gov-cargo\\.lock"
          with: ".__KUTHA_GOV_CARGO_LOCK_NAME__"

  - id: observe-incomplete-honesty
    description: >-
      Cargo non-zero exit with no required ok/FAILED lines emits one
      observe-incomplete (not N x observe-missing). M145 / Phase 219 dogfood.
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/observe.py
        needles:
          - "observe-incomplete"
          - "cargo_exit"
        require: all
        category: oracle
        message: "observe-incomplete wiring missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - "def test_cargo_incomplete_collapses_missing_when_exit_nonzero"
          - "def test_cargo_nonzero_keeps_per_name_when_failed_seen"
        require: all
        category: oracle
        message: "observe-incomplete pytest missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/observe.py
          pattern: '"observe-incomplete"'
          with: '"observe-missing-batch"'

  - id: observe-partial-incomplete
    description: >-
      Non-zero cargo exit with missing required names and no FAILED among
      required collapses to observe-incomplete (retryable partial run).
      M149 / Phase 223 dogfood. Label contract via pytest.
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/observe.py
        needles:
          - "not any_failed"
        require: all
        category: oracle
        message: "partial-observe incomplete wiring missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - "def test_cargo_partial_ok_nonzero_is_incomplete"
          - "def test_observe_retries_once_on_partial_incomplete_then_succeeds"
          - "def test_cargo_zero_exit_keeps_missing_when_partial_ok"
        require: all
        category: oracle
        message: "partial-observe incomplete pytest missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/observe.py
          pattern: "not any_failed"
          with: "any_failed"

  - id: observe-fail-detail
    description: >-
      observe-fail findings include elapsed_ms= and a truncated output tail
      (KUTHA_GOV_OBSERVE_FAIL_TAIL). M150 / Phase 224 dogfood.
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/observe.py
        needles:
          - "def _format_observe_fail"
          - "KUTHA_GOV_OBSERVE_FAIL_TAIL"
          - "elapsed_ms="
        require: all
        category: oracle
        message: "observe-fail detail wiring missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - "def test_run_cargo_observe_fail_includes_elapsed_and_stderr_tail"
          - "def test_observe_fail_tail_respects_env_limit"
        require: all
        category: oracle
        message: "observe-fail detail pytest missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/observe.py
          pattern: "def _format_observe_fail"
          with: "def _format_cargo_fail_msg"

  - id: observe-phase-ms-wall
    description: >-
      phase_ms for observe_cargo uses cargo wall time from the overlap pack,
      not Future join-wait. M151 / Phase 225 dogfood.
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/fsm.py
        needles:
          - 'overlap.pop("observe_wall_ms"'
          - "M151: overlapped observe_cargo"
        require: all
        category: oracle
        message: "observe phase_ms wall wiring missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - "def test_overlap_observe_phase_ms_uses_cargo_wall_not_join_wait"
        require: all
        category: oracle
        message: "observe phase_ms wall pytest missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/fsm.py
          pattern: 'M151: overlapped observe_cargo'
          with: 'M151: join-wait observe_cargo'

  - id: verus-proof-sync
    description: >-
      The Verus proof of vt_intersect carries the production body verbatim and
      the Verus release is pinned with a checksum. Pins sync, not proof validity:
      validity is the recorded Verus run in the phase VERIFICATION. M153 / Phase 227.
    steps:
      - kind: file_contains
        path: tools/verus/VERSION
        needles:
          - "verus_release=0.2026.10.18.7d82994"
          - "rustc=1.99.1"
        require: all
        category: oracle
        message: "Verus pin missing: {missing}"
      - kind: file_contains
        path: tools/verus/SHA256SUMS
        needles:
          - "e9af03732d4bdd32b93a8fcf471706739c24c1473fa5086618d96c47237845dd  verus-0.2026.10.18.7d82994-x86-linux.zip"
        require: all
        category: oracle
        message: "Verus release checksum missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/fold.rs
        needles:
          - "let from = a_from.max(b_from);"
          - "let a_end = a_to.unwrap_or(u64::MAX);"
          - "let b_end = b_to.unwrap_or(u64::MAX);"
          - "let to_raw = a_end.min(b_end);"
          - "if from >= to_raw {"
          - "let to = if to_raw == u64::MAX {"
        require: all
        category: oracle
        message: "production vt_intersect body drifted from the proof: {missing}"
      - kind: file_contains
        path: verus/vt_intersect.rs
        needles:
          - "let from = a_from.max(b_from);"
          - "let a_end = a_to.unwrap_or(u64::MAX);"
          - "let b_end = b_to.unwrap_or(u64::MAX);"
          - "let to_raw = a_end.min(b_end);"
          - "if from >= to_raw {"
