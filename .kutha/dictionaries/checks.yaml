schema: kutha-harness-checks/v1
meta_prompt: .kutha/META.md
# Dictionary of governor checks. Append a row to add a check.
# Kinds: see .kutha/META.md. Unknown kind → HIGH (fail-closed).
# Vacuity: optional `selftest.mutations` or `selftest.skip`. Several kinds derive
# mutations; a row with neither is UNPROVEN (`kutha-gov selftest` fails closed).
# git_path_implies stays `selftest.skip` (live diff). file_exists-only derivation
# is classified, not treated as proof of sibling steps.

checks:
  - id: trajectory
    description: Active Milestone/Slice are None or exist on ROADMAP
    steps:
      - kind: file_exists
        path: .kutha/STATE.md
        stop_on_fail: true
      - kind: file_exists
        path: .kutha/ROADMAP.md
        stop_on_fail: true
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*(?P<id>M\d+[a-z]?|None)\s*$'
        flags: [multiline]
        other: .kutha/ROADMAP.md
        skip_values: ["None"]
        inflation_pattern: '\bM\d{3}[a-z]?\b'
        inflation_max: 12
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Slice:\*\*\s*(?P<id>S\d+|None)\s*$'
        flags: [multiline]
        other: .kutha/ROADMAP.md
        skip_values: ["None"]
        label: Active Slice
        require_template: "- [ ] **{id}:"
        require_message: "Active Slice {id} is leased but ROADMAP marks it done (missing `{needle}`); reopen the checkbox in the lease bundle (STATE+CHANGELOG+ROADMAP+README) or close the lease"
      - kind: glob_absent
        glob: .kutha/ROADMAP.md
        needles:
          - "— ACTIVE"
        unless_file_contains:
          file: .kutha/STATE.md
          needle: "**Active Milestone:** M"
        category: lease
        message: "ROADMAP marks a milestone ACTIVE while STATE Active Milestone is None"

  - id: lifecycles
    description: STATE names three orthogonal lifecycles
    steps:
      - kind: file_contains
        path: .kutha/STATE.md
        needles: ["L_map=", "L_delivery=", "L_capability="]
        require: all
        category: collapse
        message: "STATE missing lifecycle rows: {missing}"
      - kind: file_absent
        path: .kutha/STATE.md
        needles: ["L_delivery=L_capability", "governor green = product"]
        case: lower
        category: collapse
        message: "STATE collapses delivery into capability"

  - id: adr-status
    description: every docs/ADR/ADR-*.md has a known Status tag
    selftest:
      mutations:
        # A honeycomb ADR claiming Accepted must trip forbid_accepted_prefix.
        - op: replace_regex
          path: docs/ADR/ADR-013-bitemporal-facts-invalidation.md
          pattern: '(?m)^\*\*Proposed\*\*'
          with: "**Accepted**"
        # An unknown Status tag must trip the allowed-tag set.
        - op: replace_regex
          path: docs/ADR/ADR-013-bitemporal-facts-invalidation.md
          pattern: '(?m)^\*\*Proposed\*\*'
          with: "**Maybe**"
    steps:
      - kind: markdown_heading_tag
        glob: docs/ADR/ADR-*.md
        heading: "## Status"
        allowed: [Research, Proposed, Accepted, Deprecated, Superseded]
        forbid_accepted_prefix: "ADR-0"
        forbid_accepted_not_prefix: "ADR-00"

  - id: freeze-rocks
    description: >-
      Cargo members may name rocksdb only as an optional dependency
      (`optional = true`); the workspace Cargo.toml must not
      name rocksdb
    steps:
      - kind: cargo_dep_constraint
        glob: crates/*/Cargo.toml
        rules:
          rocksdb: require_optional
        category: frozen-dep
        message: "found {needle}; freeze-rocks allows rocksdb in crates/*/Cargo.toml only as an optional dependency (`optional = true`)"
      - kind: cargo_dep_constraint
        glob: Cargo.toml
        rules:
          rocksdb: forbid
        category: frozen-dep
        message: "found {needle}; freeze-rocks forbids a rocksdb entry in the workspace Cargo.toml (optional crate dependency only)"

  - id: freeze-cypher-deps
    description: Cargo members and workspace Cargo.toml do not add neo4j/graphiti/falkordb until M003
    steps:
      - kind: cargo_dep_constraint
        glob: crates/*/Cargo.toml
        rules:
          neo4j: forbid
          graphiti: forbid
          falkordb: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M003 per .kutha/STATE.md Thaw map"
      - kind: cargo_dep_constraint
        glob: Cargo.toml
        rules:
          neo4j: forbid
          graphiti: forbid
          falkordb: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M003 per .kutha/STATE.md Thaw map"

  - id: freeze-hnsw-dep
    description: Cargo members and workspace Cargo.toml do not add hnswlib until M005
    steps:
      - kind: cargo_dep_constraint
        glob: crates/*/Cargo.toml
        rules:
          hnswlib: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M005 per .kutha/STATE.md Thaw map"
      - kind: cargo_dep_constraint
        glob: Cargo.toml
        rules:
          hnswlib: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M005 per .kutha/STATE.md Thaw map"

  - id: idle-delivery-closed
    description: Active Milestone None requires L_delivery token ending in -closed
    selftest:
      mutations:
        # Valid both idle and leased: force Active Milestone to None and L_delivery to a non-closed token.
        - op: replace_regex
          path: .kutha/STATE.md
          pattern: '(?s)(\*\*Active Milestone:\*\*\s*)\S+(.*?L_delivery=)\S+'
          with: '\1None\2open'
    steps:
      - kind: when_match_then_match
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*None\s*$'
        flags: [multiline]
        then_pattern: '(?m)^L_delivery=\S+-closed\s*$'
        category: lease
        message: "Active Milestone is None but L_delivery is not *-closed"

  - id: honeycomb-map
    description: STATE/ROADMAP do not treat honeycomb as the active backlog
    steps:
      - kind: concat_absent
        paths: [.kutha/STATE.md, .kutha/ROADMAP.md]
        needles:
          - "implement all adr-010"
          - "implement all honeycomb"
          - "promote all honeycomb"
          - "active milestone:** honeycomb"
          - "active milestone: honeycomb"
        case: lower
        category: backlog
        message: "harness text treats the map as work: {needle}"
      - kind: concat_contains_any
        paths: [.kutha/ROADMAP.md]
        needles: ["map, not this list", "is a **map**"]
        case: lower
        severity: low
        category: legend
        message: "ROADMAP should say honeycomb is a map, not the delivery list"

  - id: dogfood
    description: docs/process/kutha-harness.md names H0-H5 and non-authority
    steps:
      - kind: file_exists
        path: docs/process/kutha-harness.md
        stop_on_fail: true
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles: ["**H0**", "**H1**", "**H2**", "**H3**", "**H4**", "**H5**"]
        require: all
        category: ladder
        message: "dogfood ladder missing rungs: {missing}"
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles: ["not an ADR"]
        case: lower
        severity: low
        category: authority
        message: "harness doc should state it is not an ADR"
      - kind: file_absent
        path: crates/kutha-runtime/src/lib.rs
        needles: ["kutha_gov"]
        category: plane-mix
        message: "kutha-runtime must not import the harness"
      - kind: glob_none
        glob: "**/*.egg-info/*"
        category: build-artifact
        message: "setuptools egg-info must not be in the tree: {path}"

  - id: observe-required-fn
    description: FSM observe_cargo / observe_rocks required names exist as non-vacuous #[test] functions
    steps:
      - kind: rust_test_asserts
        names_from_yaml:
          path: .kutha/dictionaries/fsm.yaml
          select: states.observe_cargo.required
          glob: "crates/**/*.rs"
        category: observe-fn
        message: "FSM required names missing as asserting #[test]: {missing}"
      - kind: rust_test_asserts
        names_from_yaml:
          path: .kutha/dictionaries/fsm.yaml
          select: states.observe_rocks.required
          glob: "crates/**/*.rs"
        category: observe-fn
        message: "FSM rocks observe names missing as asserting #[test]: {missing}"

  - id: plane-mix-dicts
    description: process and product relation dictionaries keep distinct schemas
    steps:
      - kind: file_absent
        path: .kutha/dictionaries/relations.yaml
        needles: ["kutha-relations/v1", "inForceAs"]
        category: plane-mix
        message: "process allowlist must not carry product schema/relations: {needle}"
      - kind: file_absent
        path: crates/kutha-runtime/dictionaries/relations.yaml
        needles: ["kutha-harness-relations/v1"]
        category: plane-mix
        message: "product allowlist must not carry process schema: {needle}"

  - id: tenant-bin
    description: emit_tenant runs a built binary, not a second cargo compile
    steps:
      - kind: file_absent
        path: .kutha/dictionaries/fsm.yaml
        needles: ['"run", "--offline"', "cargo run"]
        category: second-compile
        message: "emit_tenant must not cargo run (second compile): {needle}"
      - kind: file_absent
        path: scripts/kutha_gov/tenant.py
        needles: ["cargo run", '"run", "--offline"']
        category: second-compile
        message: "tenant interpreter must not cargo run: {needle}"
      - kind: file_contains
        path: .kutha/dictionaries/fsm.yaml
        needles: ["build:", "kutha-tenant"]
        require: all
        category: second-compile
        message: "observe_cargo must build kutha-tenant once: {missing}"

  - id: harness-relations
    description: H3 process allowlist — one list, fail-closed JSONL writes
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/relations.yaml
      - kind: file_contains
        path: .kutha/dictionaries/relations.yaml
        needles: ["schema: kutha-harness-relations/v1", "status", "high", "low", "checks", "cargo", "tenant", "allows"]
        require: all
        category: process-allowlist
        message: "process relation dictionary missing {missing}"

  - id: h4-membership-as-of
    description: H4 historical AE1 — membership snapshot AS OF a prior process cut
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/h4_process_allows.rs
        tests:
          - h4_prior_cut_keeps_status_membership_after_later_edition_drops_it
        category: h4-overlay
        message: "H4 membership AS OF test missing {missing}"

  - id: m010-semantic-open
    description: M010 — open recovers intern meanings; Define ops; live intern appends Define
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m010_semantic_open.rs
        tests:
          - open_without_snapshot_recovers_intern_meanings
          - open_without_snapshot_or_terms_file_recovers_from_define_ops
          - intern_appends_define_for_new_terms_only
        category: m010-s01
        message: "M010 semantic open tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["Define"]
        require: all
        category: m010-s02
        message: "Op::Define missing from lean event schema: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["Op::Define", "graph_len"]
        require: all
        category: m010-s03
        message: "live intern Define / graph_len missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/store.rs
        needles: ["terms.jsonl"]
        require: all
        category: m010-s01
        message: "store persist/open missing terms.jsonl retention: {missing}"

  - id: m011-claim-supports
    description: M011 — independent supports; unknown claim fail-closed; replay lineage; thin P→Q eligibility
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_claim_supports.rs
        tests:
          - retracting_one_support_leaves_claim_supported
          - unknown_claim_does_not_append
          - replay_rejects_behavior_without_prior_cause
          - derived_q_loses_eligibility_when_last_premise_support_withdrawn
        category: m011-s01
        message: "M011 claim-support tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["claim"]
        require: all
        category: m011-s01
        message: "Assert claim field missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/fold_query.rs
        needles: ["claim_id", "live_support_count", "claim_supported_at"]
        require: all
        category: m011-s01
        message: "claim support fold helpers missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["UnknownClaim", "BrokenLineage"]
        require: all
        category: m011-s02
        message: "unknown-claim / lineage errors missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/provenance.rs
        needles: ["derivation_eligible_at"]
        require: all
        category: m011-s03
        message: "P→Q derivation eligibility oracle missing: {missing}"

  - id: m011-partial-correction
    description: M011 S04 — interval-patch residuals; whole-version Correct invents none
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_partial_correction.rs
        tests:
          - interval_patch_leaves_vt_2012_and_2021_residuals
          - whole_version_correct_does_not_invent_residuals
        category: m011-s04
        message: "M011 partial-correction tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["CorrectInterval"]
        require: all
        category: m011-s04
        message: "Op::CorrectInterval missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["IntervalPatchRejected"]
        require: all
        category: m011-s04
        message: "IntervalPatchRejected missing: {missing}"

  - id: m011-quantum-outcome
    description: M011 S05 — budgets 0/1/2 Zero/Partial/Full after persist; crash prefix needs explicit resume
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_quantum_outcome.rs
        tests:
          - budgets_0_1_2_distinguish_zero_partial_full_after_persist_open
          - crash_after_prefix_has_no_terminal_success_until_explicit_resume
        category: m011-s05
        message: "M011 quantum-outcome tests missing {missing}"

  - id: m011-typed-csr
    description: M011 S06 — typed CSR lease preserves relation labels and support multiplicity; untyped neighbor-set and FF5 still hold
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_typed_csr.rs
        tests:
          - typed_csr_preserves_relation_labels_and_support_multiplicity
          - untyped_csr_neighbor_set_and_ff5_still_hold
        category: m011-s06
        message: "M011 typed-csr tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/csr.rs
        needles: ["TypedCsrLease"]
        require: all
        category: m011-s06
        message: "TypedCsrLease missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["typed_csr_lease_at"]
        require: all
        category: m011-s06
        message: "typed_csr_lease_at missing: {missing}"

  - id: m011-provenance
    description: M011 S07 — provenance digest detects caused_by swap and rule_version change while state fingerprint matches
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_provenance.rs
        tests:
          - provenance_detects_caused_by_swap_when_state_fingerprint_matches
          - provenance_detects_rule_version_change_when_state_fingerprint_matches
        category: m011-s07
        message: "M011 provenance tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["rule_version"]
        require: all
        category: m011-s07
        message: "rule_version missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/provenance.rs
        needles: ["provenance_fingerprint"]
        require: all
        category: m011-s07
        message: "provenance_fingerprint missing: {missing}"

  - id: m011-e2e
    description: M011 S08 — candidate fixture distinguishes history, evidence, and stale admission at named cuts
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_e2e_fixture.rs
        tests:
          - e2e_fixture_supports_and_conflict_at_named_cuts
          - e2e_justification_cites_sources_and_rejects_stale_admission
          - e2e_incremental_matches_reconstruct_after_discarding_leases
        category: m011-s08
        message: "M011 e2e fixture tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/store.rs
        needles: ["JUSTIFICATIONS_REL"]
        require: all
        category: m011-s08
        message: "JUSTIFICATIONS_REL missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/admission.rs
        needles: ["conflict_report_at", "check_admission"]
        require: all
        category: m011-s08
        message: "e2e APIs missing: {missing}"

  - id: m012a-s01-log-native
    description: M012a S01 — log-native outcomes, justifications, and provenance mix
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_log_native.rs
        tests:
          - discard_outcomes_sidecar_keeps_reconstructible_disposition
          - discard_justifications_sidecar_keeps_admission_and_resume
          - provenance_fingerprint_moves_when_log_native_record_bytes_change
        category: m012a-s01
        message: "M012a S01 log-native tests missing {missing}"

  - id: m012a-s02-stable-refs
    description: M012a S02 — Retract/cite/rebuild bind minting EventId, not fold-local seq
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_stable_refs.rs
        tests:
          - retract_by_event_id_invalidates_support
          - justification_cites_source_event_ids_survive_fork
          - rebuilt_fold_renumbered_seqs_apply_same_retract_and_cite_payloads
        category: m012a-s02
        message: "M012a S02 stable-ref tests missing {missing}"

  - id: m012a-s03-idempotent-ingest
    description: M012a S03 — keyed Assert retry, claim vs support slot, stored-polarity conflict
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_idempotent_ingest.rs
        tests:
          - identical_assert_same_delivery_key_does_not_mint_second_support
          - claim_id_distinct_from_support_slot
          - conflict_report_at_partitions_by_stored_polarity
        category: m012a-s03
        message: "M012a S03 idempotent-ingest tests missing {missing}"

  - id: m012a-s04-verify-persist
    description: M012a S04 — verify-on-open, atomic events.jsonl persist on a legacy dir (no manifest; this check does not claim segmented persist), stable Define ids
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_verify_persist.rs
        tests:
          - open_rejects_tampered_snapshot
          - persist_replaces_events_jsonl_atomically
          - define_ids_stable_across_persist_open
        category: m012a-s04
        message: "M012a S04 verify-persist tests missing {missing}"

  - id: m012a-s05-time-scale
    description: M012a S05 — YearCe valid-time and log-sequence transaction-time
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_time_scale.rs
        tests:
          - fixture_years_map_to_year_ce_scale
          - transaction_time_is_log_sequence
        category: m012a-s05
        message: "M012a S05 time-scale tests missing {missing}"

  - id: m012a-s06-hot-indexes
    description: M012a S06 — fold-internal hot as_of / claim_supported_at, droppable CSR, Materializer-wired csr_lease_at
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_hot_indexes.rs
        tests:
          - as_of_and_claim_supported_at_skip_non_overlapping_facts
          - discard_csr_lease_and_snapshot_rebuild_keeps_as_of
          - csr_lease_at_builds_via_materializer
        category: m012a-s06
        message: "M012a S06 hot-index tests missing {missing}"

  - id: m012-s01-allowlist-facts
    description: M012 S01 — relation allowlist entries as versioned log facts; admit consults the fold cut
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_allowlist_facts.rs
        tests:
          - allow_relation_appends_as_log_fact
          - retract_allow_relation_drops_admit_at_later_cut
          - admit_consults_fold_allowlist_not_yaml_alone
        category: m012-s01
        message: "M012 S01 allowlist-as-facts tests missing {missing}"

  - id: m012-s02-rule-registry
    description: M012 S02 — rule registry as hashed log facts; unknown and free-string pins fail closed
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_rule_registry.rs
        tests:
          - register_rule_pins_behavior_to_definition_hash
          - unknown_or_mismatched_rule_version_fails_closed
          - free_string_rule_version_does_not_append
        category: m012-s02
        message: "M012 S02 rule-registry tests missing {missing}"

  - id: m012-s03-admission-facts
    description: M012 S03 — admission status and policy version as log meta-facts
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_admission_facts.rs
        tests:
          - admission_status_queryable_as_of_cut
          - admission_cites_pinned_policy_version
          - record_justification_invokes_check_admission
        category: m012-s03
        message: "M012 S03 admission-facts tests missing {missing}"

  - id: m012-s04-action-record
    description: M012 S04 — thin Action record binds args to admission and policy
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_action_record.rs
        tests:
          - action_binds_args_to_admission_and_policy
          - action_and_admission_as_of_prior_cut_after_policy_change
        category: m012-s04
        message: "M012 S04 action-record tests missing {missing}"

  - id: m012-s05-multi-hop
    description: M012 S05 — two-hop derivation eligibility is not one-hop-only
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_multi_hop.rs
        tests:
          - two_hop_derivation_eligible_when_chain_live
          - two_hop_ineligible_when_root_assert_retracted
          - inverse_knows_cascade_is_residual_spike
        category: m012-s05
        message: "M012 S05 multi-hop tests missing {missing}"

  - id: h4-lease
    description: H5 dogfood is closed without promoting ADR-090
    steps:
      - kind: file_contains
        path: .kutha/STATE.md
        needles: ["**Phase:** H5"]
        require: all
        category: h4-lease
        message: "STATE missing H5 phase: {missing}"
      - kind: file_contains
        path: .kutha/ROADMAP.md
        needles: ["- [x] **H4**"]
        require: all
        category: h4-lease
        message: "ROADMAP H4 checkbox not marked: {missing}"
      - kind: file_contains
        path: .kutha/ROADMAP.md
        needles: ["- [x] **H5**"]
        require: all
        category: h4-lease
        message: "ROADMAP H5 checkbox not marked done: {missing}"
      - kind: file_contains
        path: .kutha/dictionaries/honeycomb.yaml
        needles: ["delivery: frozen", "full ADR-090 ontology"]
        require: all
        category: h4-lease
        message: "ADR-090 ontology freeze missing from honeycomb: {missing}"

  - id: unnamed-csr
    description: no silent CSR “now” — callers must use csr_lease_at
    steps:
      - kind: file_absent
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["pub fn csr_lease("]
        category: unnamed-now
        message: "csr_lease() is an unnamed now; use csr_lease_at(tt, vt)"

  - id: relation-allowlist
    description: FF6 stub — one relation dictionary, fail-closed writes
    steps:
      - kind: file_exists
        path: crates/kutha-runtime/dictionaries/relations.yaml
      - kind: file_contains
        path: crates/kutha-runtime/dictionaries/relations.yaml
        needles: ["schema: kutha-relations/v1", "inForceAs", "knows", "knownBy", "runStatus", "observed", "processAllows"]
        require: all
        category: allowlist
        message: "relation dictionary missing {missing}"

  - id: toolchain
    description: harness is Python >=3.13 under uv with ruff+ty+pyrefly
    steps:
      - kind: file_equals
        path: .python-version
        equals: "3.13"
        category: python-pin
        message: ".python-version must be 3.13, found {found!r}"
      - kind: file_exists
        path: .env.example
      - kind: file_contains
        path: .env.example
        needles: ["KUTHA_GOV_BUDGET=", "KUTHA_GOV_FAIL_ON_WARN=", "KUTHA_MAX_CASCADE=", "KUTHA_GOV_CARGO_TIMEOUT_SEC=", "KUTHA_TENANT_DIR=", "KUTHA_HARNESS_LOG=", "KUTHA_TENANT_TIMEOUT_SEC=", "KUTHA_HARNESS_RELATIONS_PATH=", "KUTHA_TENANT_BIN="]
        require: all
        category: env
        message: ".env.example missing harness settings: {missing}"
      - kind: file_contains
        path: pyproject.toml
        needles:
          - 'requires-python = ">=3.13"'
          - "[tool.uv]"
          - "ruff>="
          - "ty>="
          - "pyrefly>="
          - "[tool.ty"
          - "[tool.pyrefly]"
        require: all
        category: toolchain
        message: "pyproject.toml missing toolchain pins (uv / ruff / ty / pyrefly)"

  - id: meta-prompt
    description: constitution and dictionary exist; META lists fail-closed unknown kinds
    steps:
      - kind: file_exists
        path: .kutha/META.md
      - kind: file_exists
        path: .kutha/dictionaries/checks.yaml
      - kind: file_exists
        path: .kutha/dictionaries/fsm.yaml
      - kind: file_exists
        path: .kutha/dictionaries/relations.yaml
      - kind: file_exists
        path: .kutha/dictionaries/invariants.yaml
      - kind: file_exists
        path: .kutha/dictionaries/bridges.yaml
      - kind: file_exists
        path: .kutha/dictionaries/honeycomb.yaml
      - kind: file_contains
        path: .kutha/META.md
        needles:
          - "Unknown `kind`"
          - "file_exists"
          - "pointer_in_other_file"
          - "when_match_then_match"
          - "Do not add `scripts/kutha_gov/checks/*.py`"
          - "unknown-fsm-kind"
          - "require_file"
          - "glob_none"
          - "observe_cargo"
          - "emit_tenant"
          - "yaml_needles_in_glob"
          - "git_path_implies"
          - "yaml_map_list"
          - "glob_paths_in_file"
          - "rust_test_asserts"
          - "cite_equals"
          - "refs_resolve"
          - "file_max_lines"
          - "glob_max_lines"
          - "frontmatter_paths_exist"
          - "cargo_dep_constraint"
          - "test_matrix"
          - "disk_free"
          - "budget_covers_checks"
          - "env_int_at_least"
          - "run_selftest"
          - "invariants.yaml"
          - "bridges.yaml"
          - "honeycomb.yaml"
          - "kutha-harness-relations/v1"
          - "plane-mix"
        require: all
        category: constitution
        message: "META.md missing constitution clauses"

  - id: docs-entry
    description: human and Claude Code entry files exist and CLAUDE.md shims AGENTS.md
    steps:
      - kind: file_exists
        path: README.md
        stop_on_fail: true
      - kind: file_exists
        path: CLAUDE.md
        stop_on_fail: true
      - kind: file_contains
        path: CLAUDE.md
        needles: ["@AGENTS.md"]
        require: all
        category: entry
        message: "CLAUDE.md must shim AGENTS.md"

  - id: state-readme
    description: README shows the same Active Milestone and Phase as STATE
    selftest:
      mutations:
        # README must show STATE's Phase (Milestone may be None and is skip_values).
        - op: replace_regex
          path: README.md
          pattern: 'H5'
          with: "H9"
    steps:
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*(?P<id>M\d+[a-z]?|None)\s*$'
        flags: [multiline]
        other: README.md
        skip_values: ["None"]
        label: Active Milestone
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Phase:\*\*\s*(?P<id>H\d+|None)\s*$'
        flags: [multiline]
        other: README.md
        skip_values: ["None"]
        label: Phase

  - id: version-freeze
    description: research-stage versions stay 0.0.0 until STATE names a release
    steps:
      - kind: file_contains
        path: Cargo.toml
        needles: ['version = "0.0.0"']
        require: all
        category: version-freeze
        message: "workspace version must stay 0.0.0 until STATE names a release"
      - kind: file_contains
        path: pyproject.toml
        needles: ['version = "0.0.0"']
        require: all
        category: version-freeze
        message: "harness version must stay 0.0.0 until STATE names a release"
      - kind: file_absent
        path: Cargo.toml
        needles: ["publish = true"]
        category: version-freeze
        message: "crates stay publish = false at 0.0.0"

  - id: changelog-planes
    description: CHANGELOG keeps product/process/Trajectory distinct and is not a GitHub Release
    steps:
      - kind: file_exists
        path: CHANGELOG.md
        stop_on_fail: true
      - kind: file_contains
        path: CHANGELOG.md
        needles: ["not GitHub Releases", "product", "process", "Trajectory"]
        require: all
        category: changelog-planes
        message: "CHANGELOG.md missing plane legend: {missing}"

  - id: docs-coupling
    description: plane-bearing git diffs must include the owning docs (pre-commit / auto worktree)
    selftest:
      skip: "depends on the live git diff"
    steps:
      - kind: git_path_implies
        when_any: ["crates/**/*.rs"]
        then_any: ["CHANGELOG.md"]
        message: "product crate diff without CHANGELOG.md (product plane)"
      - kind: git_path_implies
        when_any:
          - "scripts/kutha_gov/**"
          - "scripts/tests/**"
          - ".kutha/dictionaries/**"
          - ".kutha/META.md"
          - "docs/process/**"
        then_any: ["CHANGELOG.md"]
        message: "harness diff without CHANGELOG.md (process plane)"
      - kind: git_path_implies
        when_any: ["docs/ADR/**/*.md"]
        then_any: ["CHANGELOG.md"]
        message: "ADR diff without CHANGELOG.md (L_map / Trajectory)"
      - kind: git_path_implies
        when_any: [".kutha/STATE.md"]
        then_any: ["README.md"]
        message: "STATE.md diff without README.md (human lease table)"
      - kind: git_path_implies
        when_any: [".kutha/STATE.md"]
        then_any: ["CHANGELOG.md"]
        message: "STATE.md lease diff without CHANGELOG.md (process plane)"
      - kind: git_path_implies
        when_any: [".kutha/STATE.md"]
        then_any: [".kutha/ROADMAP.md"]
        message: "STATE.md lease diff without .kutha/ROADMAP.md (lease bundle)"
      - kind: git_path_implies
        when_any: ["docs/architecture/**"]
        then_any: ["CHANGELOG.md"]
        message: "architecture note diff without CHANGELOG.md (Trajectory)"
      - kind: git_path_implies
        when_any: ["docs/ADR/**/*.md"]
        then_any: [".kutha/dictionaries/honeycomb.yaml"]
        message: "ADR diff without honeycomb.yaml (L_map index)"
      - kind: git_path_implies
        when_any: [".kutha/dictionaries/checks.yaml"]
        then_any:
          - ".kutha/dictionaries/invariants.yaml"
          - ".kutha/dictionaries/bridges.yaml"
        message: "checks.yaml diff without invariants.yaml or bridges.yaml (control loop / bridge ledger)"

  - id: invariants-ledger
    description: control-loop claims get an explicit process disposition; not a Kutha requirements catalog
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/invariants.yaml
        stop_on_fail: true
      - kind: file_exists
        path: docs/process/governor-intake.md
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/invariants.yaml
        needles:
          - "schema: kutha-harness-invariants/v1"
          - "disposition: check"
          - "disposition: deferred"
        require: all
        category: intake
        message: "invariants.yaml missing schema or control-loop disposition vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/invariants.yaml
        needles:
          - "disposition: capability"
          - "disposition: map-only"
          - "docs/ADR/ADR-"
        category: intake
        message: "invariants.yaml copied L_map/L_capability into the control loop: {needle}"
      - kind: file_contains
        path: docs/process/governor-intake.md
        needles:
          - "Silence is not a requirement"
          - "disposition: check"
          - "Do not add `scripts/kutha_gov/checks/*.py`"
          - "Bridges may cite"
          - "control loop"
          - "Kutha requirements stay"
        require: all
        category: intake
        message: "governor-intake.md missing protocol clauses: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        require_fields: [id, claim, source, disposition]
        message: "invariants.yaml rows missing id/claim/source/disposition: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        unique: id
        message: "invariants.yaml duplicate id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        field: disposition
        allowed: [check, kind, deferred]
        message: "invariants.yaml unknown disposition: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        require_fields: [check]
        message: "disposition=check rows missing check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        unique: check
        message: "disposition=check rows share a check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: deferred
        require_fields: [until]
        message: "disposition=deferred rows missing until: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: kind
        require_fields: [kind]
        message: "disposition=kind rows missing kind name: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        field: check
        other: .kutha/dictionaries/checks.yaml
        prefix: "  - id: "
        message: "control-loop check ids missing from checks.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        field: check
        other: .kutha/dictionaries/bridges.yaml
        prefix: "    check: "
        absent_other: true
        message: "control-loop check ids also listed as bridges: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/checks.yaml
        select: checks
        field: id
        other:
          - .kutha/dictionaries/invariants.yaml
          - .kutha/dictionaries/bridges.yaml
        prefix: "    check: "
        message: "checks.yaml ids missing a control-loop or bridge ledger row: {missing}"

  - id: bridges-ledger
    description: bridges cite product freeze or tests; they do not copy Kutha requirements into the harness
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/bridges.yaml
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/bridges.yaml
        needles:
          - "schema: kutha-harness-bridges/v1"
          - "cites:"
        require: all
        category: bridge
        message: "bridges.yaml missing schema or cites vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/bridges.yaml
        needles:
          - "disposition:"
          - "disposition: map-only"
          - "disposition: capability"
        category: bridge
        message: "bridges.yaml copied control-loop dispositions: {needle}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        require_fields: [id, claim, cites, check]
        message: "bridges.yaml rows missing id/claim/cites/check: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        unique: id
        message: "bridges.yaml duplicate id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        unique: check
        message: "bridges.yaml duplicate check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        field: check
        other: .kutha/dictionaries/checks.yaml
        prefix: "  - id: "
        message: "bridge check ids missing from checks.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        field: check
        other: .kutha/dictionaries/invariants.yaml
        prefix: "    check: "
        absent_other: true
        message: "bridge check ids also listed in the control-loop ledger: {missing}"

  - id: honeycomb-ledger
    description: L_map compact index stays fail-closed; not a delivery backlog and not product dictionaries
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/honeycomb.yaml
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/honeycomb.yaml
        needles:
          - "schema: kutha-map-honeycomb/v1"
          - "delivery: spike"
          - "delivery: frozen"
          - "delivery: map-only"
          - "capability: none"
          - "capability: named"
        require: all
        category: map
        message: "honeycomb.yaml missing schema or stage vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/honeycomb.yaml
        needles:
          - "disposition: check"
          - "promote all"
        category: map
        message: "honeycomb.yaml mixed into control-loop or backlog: {needle}"
      - kind: glob_paths_in_file
        glob: docs/ADR/ADR-*.md
        path: .kutha/dictionaries/honeycomb.yaml
        prefix: "    path: "
        message: "ADR files missing from honeycomb.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: locks
        require_fields: [id, must, path]
        unique: id
        message: "honeycomb locks missing id/must/path: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        require_fields: [id, axis, must, path, map, delivery, capability]
        require_list_fields: [depends_on, locks, evidence]
        unique: id
        message: "honeycomb cells missing required fields: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: path
        must_exist: true
        message: "honeycomb cell paths do not exist: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: map
        allowed: [Research, Proposed, Deprecated, Superseded]
        message: "honeycomb map status not in ADR vocab (Accepted is Nygard, not this ledger): {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: delivery
        allowed: [map-only, frozen, spike]
        message: "honeycomb unknown delivery stage: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: capability
        allowed: [none, named]
        message: "honeycomb unknown capability stage: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: axis
        allowed: [Time, Space, Composition, Data, Agent, Verify, Query, Security, Vertical, Packaging]
        message: "honeycomb unknown axis: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        field: map
        in_path_field: path
        prefix: "**"
        suffix: "**"
        message: "honeycomb map status missing from ADR Status: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        when:
          delivery: frozen
        require_fields: [freeze_as]
        message: "frozen cells missing freeze_as: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        when:
          delivery: frozen
        field: freeze_as
        other: .kutha/STATE.md
        prefix: ""
        message: "freeze_as needles missing from STATE freeze: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        when:
          capability: named
        nonempty_list: evidence
        message: "capability=named cells missing evidence tests: {missing}"
      - kind: rust_test_asserts
        names_from_yaml:
          path: .kutha/dictionaries/honeycomb.yaml
          select: cells
          field: evidence
          glob: "crates/**/*.rs"
        require_evidence_when:
          field: capability
          equals: named
        category: map
        message: "honeycomb evidence names missing as asserting #[test]: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        list_field: depends_on
        other: .kutha/dictionaries/honeycomb.yaml
        prefix: "  - id: "
        message: "depends_on ids missing from honeycomb cells: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/honeycomb.yaml
        select: cells
        list_field: locks
        other: .kutha/dictionaries/honeycomb.yaml
        prefix: "  - id: "
        message: "lock ids missing from honeycomb locks: {missing}"

  - id: cite-lease
    description: >-
      Docs that write a concrete L_delivery=, L_map=, L_capability=, or
      Active Milestone M### token must match the STATE assignment.
      Lifecycle capture is KEY= plus an alphanumeric token
      ([A-Za-z0-9][A-Za-z0-9._-]*). Empty `L_delivery=` and placeholders such as
      `L_delivery=<lease>` are not cites (token-format prose and AGENTS.md
      "Read STATE.md" stay silent). A concrete token, including one inside
      backticks, is a cite — stale L_delivery=M011-S03-done is HIGH.
      Active Milestone cites are status phrasing (is/stays/colon), not
      "names M002" thaw language. CHANGELOG.md is out of scope. `.planning/`
      is out of scope except PROJECT.md.
    selftest:
      mutations:
        - op: append_text
          path: .planning/PROJECT.md
          text: "\nActive Milestone: M015\n"
    steps:
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: AGENTS.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: README.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: STRATEGY.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/process/*.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/architecture/*.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: docs/ADR/README.md
            pattern: 'L_delivery=([A-Za-z0-9][A-Za-z0-9._-]*)'
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^L_map=([A-Za-z0-9][A-Za-z0-9._-]*)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: AGENTS.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: README.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: STRATEGY.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/process/*.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/architecture/*.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: docs/ADR/README.md
            pattern: 'L_map=([A-Za-z0-9][A-Za-z0-9._-]*)'
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: AGENTS.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: README.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: STRATEGY.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/process/*.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - glob: docs/architecture/*.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
          - path: docs/ADR/README.md
            pattern: 'L_capability=([A-Za-z0-9][A-Za-z0-9._-]*)'
      - kind: cite_equals
        source:
          path: .kutha/STATE.md
          pattern: '(?m)^\*\*Active Milestone:\*\*\s*(M\d{3}[a-z]?|None)\s*$'
        cites:
          - path: .planning/PROJECT.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: AGENTS.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: README.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: STRATEGY.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - glob: docs/process/*.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - glob: docs/architecture/*.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: docs/ADR/README.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: .kutha/ROADMAP.md
            pattern: 'Active Milestone(?:\*\*)?(?:\s+is|\s+stays)?(?::\*\*|:)?\s+\**?(M\d{3}[a-z]?)\b'
          - path: .kutha/ROADMAP.md
            pattern: '(?m)^## (M\d{3}[a-z]?):[^\n]*\bACTIVE\b'
          - path: .kutha/ROADMAP.md
            pattern: '\*\*(M\d{3}[a-z]?)\*\*\s+—\s+ACTIVE'

  - id: refs-resolve
    description: >-
      ADR-NNN and D1-D10 citations in AGENTS.md, README.md, .kutha markdown,
      dictionary YAML, and docs/process must resolve. Ranges (en dash or hyphen)
      contribute both endpoints, not the interior. ADR-XXX (non-digit) is ignored.
      Leading-zero forms D010-1 and D050-2 are honeycomb sub-decisions, not lock
      ids. ADR-100 may dangle (frozen do-not-open). CHANGELOG and .planning are
      out of scope.
    steps:
      - kind: refs_resolve
        paths:
          - AGENTS.md
          - README.md
        globs:
          - .kutha/**/*.md
          - .kutha/dictionaries/*.yaml
          - docs/process/*.md
        allow_dangling:
          - ADR-100

  - id: agents-lean
    description: >-
      AGENTS.md line count is wc -l and must stay at or under 110 (Phase 9
      result was 100). file_absent forbids lease assignment tokens
      L_delivery=, L_map=, L_capability=, and the sentence M011 is active.
    steps:
      - kind: file_max_lines
        path: AGENTS.md
        max: 110
      - kind: file_absent
        path: AGENTS.md
        needles:
          - "L_delivery="
          - "L_map="
          - "L_capability="
          - "M011 is active"

  - id: artifact-budget
    description: >-
      Live-phase planning artifacts (v0.06 onward, including v0.07/v0.08)
      stay within declared line and per-directory file budgets (D-02, D-04).
    selftest:
      skip: "no live .planning/phases CONTEXT"
      skip_unless_glob: .planning/phases/*-*/*-CONTEXT.md
    steps:
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-PLAN.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        correspond_glob: .planning/phases/*-*/*-CONTEXT.md
        correspond_skip_if: "*-VERIFICATION.md"
        max: 150
        max_files_per_dir: 2
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-SUMMARY.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        max: 60
        max_files_per_dir: 1
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        max: 60
        max_files_per_dir: 1
      - kind: glob_max_lines
        glob: .planning/phases/*-*/*-CONTEXT.md
        min_phase: 22
        min_hits: 1
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        max: 80
        max_files_per_dir: 1

  - id: verification-independent
    description: >-
      Live-phase VERIFICATION files must not list plan or summary artifact paths
      and must carry independence frontmatter (D-05). When live CONTEXT exists,
      missing VERIFICATION is HIGH (CE review P1 #16); idle without CONTEXT skips.
    selftest:
      skip: >-
        selftest copy drops tmp/, .planning/milestones, and .compound-engineering
        cited by archived phase VERIFICATION read_only_inputs; CE #16 idle/live
        contract is proved by VerificationIndependentTests
    steps:
      - kind: glob_absent
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        needles:
          - "-PLAN.md"
          - "-SUMMARY.md"
      - kind: file_contains
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        needles: ["independent: true", "verifier_model", "commands:", "read_only_inputs:", "exit:"]
        require: all
      - kind: frontmatter_paths_exist
        glob: .planning/phases/*-*/*-VERIFICATION.md
        min_phase: 22
        when_glob_exists: .planning/phases/*-*/*-CONTEXT.md
        field: read_only_inputs

  - id: id-map-cite
    description: >-
      One Id map table lives in docs/process/gsd-auto-contract.md; both
      ROADMAPs link to § Id map and must not restate the table header (D-06).
    steps:
      - kind: file_contains
        path: docs/process/gsd-auto-contract.md
        needles: ["## Id map", "GSD version", "v0.06", "v0.07", "v0.08", "v0.09", "v0.12", "v0.13", "v0.16", "v0.17"]
        require: all
      - kind: file_contains
        path: .planning/ROADMAP.md
        needles: ["docs/process/gsd-auto-contract.md", "Id map"]
        require: all
      - kind: file_contains
        path: .kutha/ROADMAP.md
        needles: ["docs/process/gsd-auto-contract.md", "Id map"]
        require: all
      - kind: file_absent
        path: .planning/ROADMAP.md
        needles: ["| GSD version | Phases | Harness"]
      - kind: file_absent
        path: .kutha/ROADMAP.md
        needles: ["| GSD version | Phases | Harness"]

  - id: product-close-gate
    description: >-
      Product close checklist names workspace cargo tests and full ci;
      precommit alone is not a product close gate (M022 Phase 72 lesson).
    steps:
      - kind: file_contains
        path: docs/process/gsd-auto-contract.md
        needles:
          - "cargo test --workspace --offline --no-fail-fast"
          - "uv run kutha-gov ci"
          - "`precommit` alone is not a product close gate"
        require: all
    selftest:
      mutations:
        - op: replace_regex
          path: docs/process/gsd-auto-contract.md
          pattern: "`precommit` alone is not a product close gate"
          with: "`precommit` is enough for product close"

  - id: stub-ci-honest-name
    description: >-
      Pytest full-quantum with stub cargo must not be named as live-tree green
      (CE review P1 #7). Live observe remains kutha-gov ci / KUTHA_LIVE_CARGO.
    steps:
      - kind: glob_absent
        glob: scripts/tests/test_kutha_gov.py
        needles:
          - "def test_ci_green_on_this_tree("
        category: oracle
        message: "stubbed CI quantum still uses lying name test_ci_green_on_this_tree"
      - kind: file_contains
        path: scripts/tests/test_kutha_gov.py
        needles:
          - "def test_ci_fsm_reaches_ok_with_stubbed_observe"
          - "KUTHA_LIVE_CARGO"
        require: all
        category: oracle
        message: "stub-scoped FSM test or live cargo opt-in missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/tests/test_kutha_gov.py
          pattern: "def test_ci_fsm_reaches_ok_with_stubbed_observe"
          with: "def test_ci_green_on_this_tree"

  - id: disk-free
    description: >-
      Fail closed when free disk under the repo filesystem is below YAML
      min_free_gib (protects heavy ci/cargo from mid-wave ENOSPC).
    steps:
      - kind: disk_free
        path: "."
        min_free_gib: 2
        category: disk-free
        message: "{path} has {free_gib:.2f} GiB free; min_free_gib={min_free_gib}"

  - id: budget-template-align
    description: >-
      .env.example KUTHA_GOV_BUDGET must equal fsm.yaml defaults.budget so a
      copied .env cannot silently truncate the check tail (M058 residual).
    steps:
      - kind: cite_equals
        source:
          path: .kutha/dictionaries/fsm.yaml
          pattern: '(?m)^  budget:\s*(\d+)\s*$'
        cites:
          - path: .env.example
            pattern: '(?m)^KUTHA_GOV_BUDGET=(\d+)\s*$'
        message: "{path} cites KUTHA_GOV_BUDGET={got} but {source} defaults.budget is {expected}"

  - id: budget-covers-checks
    description: >-
      fsm.yaml defaults.budget must be at least the dictionary check count so
      Cui cannot truncate the tail (precommit gate; complements ci truncation HIGH).
    steps:
      - kind: budget_covers_checks
        message: "defaults.budget={budget} covers {n} checks incompletely (short by {short})"

  - id: env-budget-floor
    description: >-
      Live KUTHA_GOV_BUDGET when set must be ≥ fsm.yaml defaults.budget so a
      stale .env cannot truncate only on ci (precommit runs the full dictionary).
    steps:
      - kind: env_int_at_least
        env: KUTHA_GOV_BUDGET
        at_least:
          path: .kutha/dictionaries/fsm.yaml
          pattern: '(?m)^  budget:\s*(\d+)\s*$'
        message: "{env}={got} is below fsm defaults.budget={floor}"

  - id: verification-uv-only
    description: >-
      VERIFICATION command records invoke kutha-gov via uv (CE whole-repo #35).
      Ambient python/-m replay can select the wrong interpreter.
    steps:
      - kind: glob_absent
        glob: ".planning/**/*VERIFICATION.md"
        needles:
          - "python -m kutha_gov"
          - "python3 -m kutha_gov"
        category: oracle
        message: "VERIFICATION still records ambient python kutha_gov: {needle}"
    selftest:
      mutations:
        # Selftest copy drops `.planning/milestones/`; mutate a living phase VERIFICATION.
        - op: replace_regex
          path: .planning/phases/126-norm-view-derived-correct/126-VERIFICATION.md
          pattern: "uv run kutha-gov ci"
          with: "python -m kutha_gov ci"

  - id: statute-fixture-single-lang
    description: >-
      Statute fixture punkt_15_1.txt stays single-language (CE whole-repo #36).
      English metadata belongs outside the payload file.
    steps:
      - kind: file_absent
        path: crates/kutha-runtime/fixtures/statute/punkt_15_1.txt
        needles:
          - "law-nexus"
          - "ADR-090"
          - "test data only"
        category: oracle
        message: "statute fixture mixes English metadata into payload: {needle}"
      - kind: file_contains
        path: crates/kutha-runtime/fixtures/statute/punkt_15_1.txt
        needles: ["15.1", "2028"]
        require: all
        category: oracle
        message: "statute fixture missing required payload tokens: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: crates/kutha-runtime/fixtures/statute/punkt_15_1.txt
          pattern: "(пункт 15\\.1 действует до 01\\.01\\.2028)"
          with: "\\1\n(law-nexus syn-001 / C01 quote — test data only; not an ADR-090 pack thaw)"

  - id: parallel-check-error-parity
    description: >-
      check.run exceptions are check-error under jobs=1 and jobs>1; worker-error
      is reserved for transport failures (CE review P2 #23).
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/parallel.py
        needles:
          - "return eval_check(check, ctx)"
          - "Same exception → check-error mapping as eval_check"
        require: all
        category: oracle
        message: "parallel worker missing shared eval_check exception path: {missing}"
      - kind: file_contains
        path: scripts/tests/test_jobs.py
        needles:
          - "test_mini_tree_check_raise_is_check_error_jobs_1_and_2"
          - 'self.assertIn("check-error"'
          - 'self.assertNotIn("worker-error"'
        require: all
        category: oracle
        message: "parallel check-error parity oracle missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/parallel.py
          pattern: "return eval_check\\(check, ctx\\)"
          with: "return check.run(ctx)"

  - id: observe-skipped-breadcrumb
    description: >-
      Suppressed observe_cargo leaves a LOW observe-skipped finding naming state
      and cause; observation uses allowlisted cargo (CE review P2 #39).
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/fsm.py
        needles:
          - "def _note_observe_skipped"
          - '"observe-skipped"'
          - 'outcome.observations.append(("cargo", "skipped"))'
        require: all
        category: oracle
        message: "observe-skipped breadcrumb missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - "test_second_observe_cargo_notes_skip_after_prior_high"
          - 'category == "observe-skipped"'
          - "prior-high"
        require: all
        category: oracle
        message: "observe-skipped oracle missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/fsm.py
          pattern: 'outcome.observations.append\(\("cargo", "skipped"\)\)'
          with: 'outcome.observations.append(("cargo", "ok"))'

  - id: parallel-context-flags
    description: >-
      Parallel worker Context carries skip_emit and changed_paths from the caller
      (CE review P2 #48).
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/parallel.py
        needles:
          - "skip_emit / changed_paths must match the caller Context"
          - "skip_emit=skip_emit"
          - "changed_paths=changed_paths"
          - "ctx.skip_emit"
          - "ctx.changed_paths"
        require: all
        category: oracle
        message: "parallel Context flag plumbing missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_jobs.py
        needles:
          - "test_eval_check_worker_propagates_skip_emit_and_changed_paths"
          - "skip_emit=True"
          - "a.md,b.md"
        require: all
        category: oracle
        message: "parallel Context flag oracle missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/parallel.py
          pattern: "skip_emit=skip_emit,"
          with: "skip_emit=False,"

  - id: skip-cargo-log-marker
    description: >-
      skip_cargo / prior-high emit_tenant leaves allowlisted tenant=skipped so fold
      tip is not a stale full-evidence tenant (CE review P2 #38).
    steps:
      - kind: file_contains
        path: scripts/kutha_gov/fsm.py
        needles:
          - "CE #38: skip-cargo / prior-high must not leave a stale last_tenant tip"
          - 'outcome.observations.append(("tenant", "skipped"))'
          - 'append_observe(ctx.root, "tenant", "skipped")'
        require: all
        category: oracle
        message: "skip-cargo tenant marker missing: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - 'self.assertEqual("skipped", picture.last_cargo)'
          - 'self.assertEqual("skipped", picture.last_tenant)'
          - '("tenant", "skipped")'
        require: all
        category: oracle
        message: "skip-cargo fold marker oracle missing: {missing}"
    selftest:
      mutations:
        - op: replace_regex
          path: scripts/kutha_gov/fsm.py
          pattern: 'append_observe\(ctx\.root, "tenant", "skipped"\)'
          with: 'append_observe(ctx.root, "tenant", "ok")'

  - id: op-compat-policy
    description: >-
      G4 CE #14 / CE #1: documented Op wire break — legacy dictionary meta-ops fail
