        require: all
        category: oracle
        message: "op_migrate module missing: {missing}"
      - kind: file_absent
        path: crates/kutha-common/src/event.rs
        needles:
          - "AllowRelation {"
          - "RegisterRule {"
          - "PinPolicy {"
          - "RecordAdmission {"
          - "RecordAction {"
        category: oracle
        message: "removed Op variants revived in event.rs: {needle}"
    selftest:
      mutations:
        - op: replace_regex
          path: docs/process/op-compat.md
          pattern: "Policy: documented break; open fail-open; explicit migrate for AllowRelation \\(serde aliases forbidden\\)"
          with: "Policy: silent skip of unknown Op variants"

