schema: kutha-harness-checks/v1
meta_prompt: .kutha/META.md
# Dictionary of governor checks. Append a row to add a check.
# Kinds: see .kutha/META.md. Unknown kind → HIGH (fail-closed).
# Vacuity: optional `selftest.mutations` or `selftest.skip`. Several kinds derive
# mutations; a row with neither is UNPROVEN (`kutha-gov selftest` fails closed).
# git_path_implies stays `selftest.skip` (live diff). file_exists-only derivation
# is classified, not treated as proof of sibling steps.

checks:
  - id: trajectory
    description: Active Milestone/Slice are None or exist on ROADMAP
    steps:
      - kind: file_exists
        path: .kutha/STATE.md
        stop_on_fail: true
      - kind: file_exists
        path: .kutha/ROADMAP.md
        stop_on_fail: true
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*(?P<id>M\d+[a-z]?|None)\s*$'
        flags: [multiline]
        other: .kutha/ROADMAP.md
        skip_values: ["None"]
        inflation_pattern: '\bM\d{3}[a-z]?\b'
        inflation_max: 12
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Slice:\*\*\s*(?P<id>S\d+|None)\s*$'
        flags: [multiline]
        other: .kutha/ROADMAP.md
        skip_values: ["None"]
        label: Active Slice
        require_template: "- [ ] **{id}:"
        require_message: "Active Slice {id} is leased but ROADMAP marks it done (missing `{needle}`); reopen the checkbox in the lease bundle (STATE+CHANGELOG+ROADMAP+README) or close the lease"
      - kind: glob_absent
        glob: .kutha/ROADMAP.md
        needles:
          - "— ACTIVE"
        unless_file_contains:
          file: .kutha/STATE.md
          needle: "**Active Milestone:** M"
        category: lease
        message: "ROADMAP marks a milestone ACTIVE while STATE Active Milestone is None"

  - id: lifecycles
    description: STATE names three orthogonal lifecycles
    steps:
      - kind: file_contains
        path: .kutha/STATE.md
        needles: ["L_map=", "L_delivery=", "L_capability="]
        require: all
        category: collapse
        message: "STATE missing lifecycle rows: {missing}"
      - kind: file_absent
        path: .kutha/STATE.md
        needles: ["L_delivery=L_capability", "governor green = product"]
        case: lower
        category: collapse
        message: "STATE collapses delivery into capability"

  - id: adr-status
    description: every docs/ADR/ADR-*.md has a known Status tag
    selftest:
      mutations:
        # A honeycomb ADR claiming Accepted must trip forbid_accepted_prefix.
        - op: replace_regex
          path: docs/ADR/ADR-013-bitemporal-facts-invalidation.md
          pattern: '(?m)^\*\*Proposed\*\*'
          with: "**Accepted**"
        # An unknown Status tag must trip the allowed-tag set.
        - op: replace_regex
          path: docs/ADR/ADR-013-bitemporal-facts-invalidation.md
          pattern: '(?m)^\*\*Proposed\*\*'
          with: "**Maybe**"
    steps:
      - kind: markdown_heading_tag
        glob: docs/ADR/ADR-*.md
        heading: "## Status"
        allowed: [Research, Proposed, Accepted, Deprecated, Superseded]
        forbid_accepted_prefix: "ADR-0"
        forbid_accepted_not_prefix: "ADR-00"

  - id: freeze-rocks
    description: >-
      Cargo members may name rocksdb only as an optional dependency
      (`optional = true`); the workspace Cargo.toml must not
      name rocksdb
    steps:
      - kind: cargo_dep_constraint
        glob: crates/*/Cargo.toml
        rules:
          rocksdb: require_optional
        category: frozen-dep
        message: "found {needle}; freeze-rocks allows rocksdb in crates/*/Cargo.toml only as an optional dependency (`optional = true`)"
      - kind: cargo_dep_constraint
        glob: Cargo.toml
        rules:
          rocksdb: forbid
        category: frozen-dep
        message: "found {needle}; freeze-rocks forbids a rocksdb entry in the workspace Cargo.toml (optional crate dependency only)"

  - id: freeze-cypher-deps
    description: Cargo members and workspace Cargo.toml do not add neo4j/graphiti/falkordb until M003
    steps:
      - kind: cargo_dep_constraint
        glob: crates/*/Cargo.toml
        rules:
          neo4j: forbid
          graphiti: forbid
          falkordb: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M003 per .kutha/STATE.md Thaw map"
      - kind: cargo_dep_constraint
        glob: Cargo.toml
        rules:
          neo4j: forbid
          graphiti: forbid
          falkordb: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M003 per .kutha/STATE.md Thaw map"

  - id: freeze-hnsw-dep
    description: Cargo members and workspace Cargo.toml do not add hnswlib until M005
    steps:
      - kind: cargo_dep_constraint
        glob: crates/*/Cargo.toml
        rules:
          hnswlib: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M005 per .kutha/STATE.md Thaw map"
      - kind: cargo_dep_constraint
        glob: Cargo.toml
        rules:
          hnswlib: forbid
        category: frozen-dep
        message: "found {needle}; frozen until M005 per .kutha/STATE.md Thaw map"

  - id: idle-delivery-closed
    description: Active Milestone None requires L_delivery token ending in -closed
    selftest:
      mutations:
        # Valid both idle and leased: force Active Milestone to None and L_delivery to a non-closed token.
        - op: replace_regex
          path: .kutha/STATE.md
          pattern: '(?s)(\*\*Active Milestone:\*\*\s*)\S+(.*?L_delivery=)\S+'
          with: '\1None\2open'
    steps:
      - kind: when_match_then_match
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*None\s*$'
        flags: [multiline]
        then_pattern: '(?m)^L_delivery=\S+-closed\s*$'
        category: lease
        message: "Active Milestone is None but L_delivery is not *-closed"

  - id: honeycomb-map
    description: STATE/ROADMAP do not treat honeycomb as the active backlog
    steps:
      - kind: concat_absent
        paths: [.kutha/STATE.md, .kutha/ROADMAP.md]
        needles:
          - "implement all adr-010"
          - "implement all honeycomb"
          - "promote all honeycomb"
          - "active milestone:** honeycomb"
          - "active milestone: honeycomb"
        case: lower
        category: backlog
        message: "harness text treats the map as work: {needle}"
      - kind: concat_contains_any
        paths: [.kutha/ROADMAP.md]
        needles: ["map, not this list", "is a **map**"]
        case: lower
        severity: low
        category: legend
        message: "ROADMAP should say honeycomb is a map, not the delivery list"

  - id: dogfood
    description: docs/process/kutha-harness.md names H0-H5 and non-authority
    steps:
      - kind: file_exists
        path: docs/process/kutha-harness.md
        stop_on_fail: true
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles: ["**H0**", "**H1**", "**H2**", "**H3**", "**H4**", "**H5**"]
        require: all
        category: ladder
        message: "dogfood ladder missing rungs: {missing}"
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles: ["not an ADR"]
        case: lower
        severity: low
        category: authority
        message: "harness doc should state it is not an ADR"
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles:
          - "| migrate-bin |"
          - "debug/kutha-migrate"
        require: all
        category: oracle
        message: "harness CutPort migrate-bin missing: {missing}"
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles:
          - "`json`, `precommit`, or `selftest`"
          - "uv run kutha-gov selftest --check"
        require: all
        category: oracle
        message: "harness --check surfaces missing: {missing}"
      - kind: file_absent
        path: docs/process/kutha-harness.md
        needles:
          - "`--check ID` is valid only with `json` or `precommit`"
        category: oracle
        message: "harness still limits --check to json|precommit only: {needle}"
      - kind: file_absent
        path: crates/kutha-runtime/src/lib.rs
        needles: ["kutha_gov"]
        category: plane-mix
        message: "kutha-runtime must not import the harness"
      - kind: glob_none
        glob: "**/*.egg-info/*"
        category: build-artifact
        message: "setuptools egg-info must not be in the tree: {path}"

  - id: observe-required-fn
    description: FSM observe_cargo / observe_rocks required names exist as non-vacuous #[test] functions
    steps:
      - kind: rust_test_asserts
        names_from_yaml:
          path: .kutha/dictionaries/fsm.yaml
          select: states.observe_cargo.required
          glob: "crates/**/*.rs"
        category: observe-fn
        message: "FSM required names missing as asserting #[test]: {missing}"
      - kind: rust_test_asserts
        names_from_yaml:
          path: .kutha/dictionaries/fsm.yaml
          select: states.observe_rocks.required
          glob: "crates/**/*.rs"
        category: observe-fn
        message: "FSM rocks observe names missing as asserting #[test]: {missing}"

  - id: plane-mix-dicts
    description: process and product relation dictionaries keep distinct schemas
    steps:
      - kind: file_absent
        path: .kutha/dictionaries/relations.yaml
        needles: ["kutha-relations/v1", "inForceAs"]
        category: plane-mix
        message: "process allowlist must not carry product schema/relations: {needle}"
      - kind: file_absent
        path: crates/kutha-runtime/dictionaries/relations.yaml
        needles: ["kutha-harness-relations/v1"]
        category: plane-mix
        message: "product allowlist must not carry process schema: {needle}"

  - id: tenant-bin
    description: >-
      observe_cargo builds kutha-tenant and kutha-migrate once; emit_tenant runs
      the built binary, not a second cargo compile
    steps:
      - kind: file_absent
        path: .kutha/dictionaries/fsm.yaml
        needles: ['"run", "--offline"', "cargo run"]
        category: second-compile
        message: "emit_tenant must not cargo run (second compile): {needle}"
      - kind: file_absent
        path: scripts/kutha_gov/tenant.py
        needles: ["cargo run", '"run", "--offline"']
        category: second-compile
        message: "tenant interpreter must not cargo run: {needle}"
      - kind: file_contains
        path: .kutha/dictionaries/fsm.yaml
        needles: ["build:", "kutha-tenant", "kutha-migrate"]
        require: all
        category: second-compile
        message: "observe_cargo must build kutha-tenant and kutha-migrate once: {missing}"
      - kind: file_contains
        path: scripts/tests/test_fsm.py
        needles:
          - "def test_observe_default_build_includes_migrate"
          - "kutha-migrate"
        require: all
        category: second-compile
        message: "observe dual-bin build oracle missing: {missing}"

  - id: harness-relations
    description: H3 process allowlist — one list, fail-closed JSONL writes
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/relations.yaml
      - kind: file_contains
        path: .kutha/dictionaries/relations.yaml
        needles: ["schema: kutha-harness-relations/v1", "status", "high", "low", "checks", "cargo", "tenant", "allows"]
        require: all
        category: process-allowlist
        message: "process relation dictionary missing {missing}"

  - id: h4-membership-as-of
    description: H4 historical AE1 — membership snapshot AS OF a prior process cut
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/h4_process_allows.rs
        tests:
          - h4_prior_cut_keeps_status_membership_after_later_edition_drops_it
        category: h4-overlay
        message: "H4 membership AS OF test missing {missing}"

  - id: m010-semantic-open
    description: M010 — open recovers intern meanings; Define ops; live intern appends Define
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m010_semantic_open.rs
        tests:
          - open_without_snapshot_recovers_intern_meanings
          - open_without_snapshot_or_terms_file_recovers_from_define_ops
          - intern_appends_define_for_new_terms_only
        category: m010-s01
        message: "M010 semantic open tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["Define"]
        require: all
        category: m010-s02
        message: "Op::Define missing from lean event schema: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["Op::Define", "graph_len"]
        require: all
        category: m010-s03
        message: "live intern Define / graph_len missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/store.rs
        needles: ["terms.jsonl"]
        require: all
        category: m010-s01
        message: "store persist/open missing terms.jsonl retention: {missing}"

  - id: m011-claim-supports
    description: M011 — independent supports; unknown claim fail-closed; replay lineage; thin P→Q eligibility
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_claim_supports.rs
        tests:
          - retracting_one_support_leaves_claim_supported
          - unknown_claim_does_not_append
          - replay_rejects_behavior_without_prior_cause
          - derived_q_loses_eligibility_when_last_premise_support_withdrawn
        category: m011-s01
        message: "M011 claim-support tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["claim"]
        require: all
        category: m011-s01
        message: "Assert claim field missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/fold_query.rs
        needles: ["claim_id", "live_support_count", "claim_supported_at"]
        require: all
        category: m011-s01
        message: "claim support fold helpers missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["UnknownClaim", "BrokenLineage"]
        require: all
        category: m011-s02
        message: "unknown-claim / lineage errors missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/provenance.rs
        needles: ["derivation_eligible_at"]
        require: all
        category: m011-s03
        message: "P→Q derivation eligibility oracle missing: {missing}"

  - id: m011-partial-correction
    description: M011 S04 — interval-patch residuals; whole-version Correct invents none
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_partial_correction.rs
        tests:
          - interval_patch_leaves_vt_2012_and_2021_residuals
          - whole_version_correct_does_not_invent_residuals
        category: m011-s04
        message: "M011 partial-correction tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["CorrectInterval"]
        require: all
        category: m011-s04
        message: "Op::CorrectInterval missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["IntervalPatchRejected"]
        require: all
        category: m011-s04
        message: "IntervalPatchRejected missing: {missing}"

  - id: m011-quantum-outcome
    description: M011 S05 — budgets 0/1/2 Zero/Partial/Full after persist; crash prefix needs explicit resume
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_quantum_outcome.rs
        tests:
          - budgets_0_1_2_distinguish_zero_partial_full_after_persist_open
          - crash_after_prefix_has_no_terminal_success_until_explicit_resume
        category: m011-s05
        message: "M011 quantum-outcome tests missing {missing}"

  - id: m011-typed-csr
    description: M011 S06 — typed CSR lease preserves relation labels and support multiplicity; untyped neighbor-set and FF5 still hold
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_typed_csr.rs
        tests:
          - typed_csr_preserves_relation_labels_and_support_multiplicity
          - untyped_csr_neighbor_set_and_ff5_still_hold
        category: m011-s06
        message: "M011 typed-csr tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/csr.rs
        needles: ["TypedCsrLease"]
        require: all
        category: m011-s06
        message: "TypedCsrLease missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["typed_csr_lease_at"]
        require: all
        category: m011-s06
        message: "typed_csr_lease_at missing: {missing}"

  - id: m011-provenance
    description: M011 S07 — provenance digest detects caused_by swap and rule_version change while state fingerprint matches
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_provenance.rs
        tests:
          - provenance_detects_caused_by_swap_when_state_fingerprint_matches
          - provenance_detects_rule_version_change_when_state_fingerprint_matches
        category: m011-s07
        message: "M011 provenance tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-common/src/event.rs
        needles: ["rule_version"]
        require: all
        category: m011-s07
        message: "rule_version missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/provenance.rs
        needles: ["provenance_fingerprint"]
        require: all
        category: m011-s07
        message: "provenance_fingerprint missing: {missing}"

  - id: m011-e2e
    description: M011 S08 — candidate fixture distinguishes history, evidence, and stale admission at named cuts
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m011_e2e_fixture.rs
        tests:
          - e2e_fixture_supports_and_conflict_at_named_cuts
          - e2e_justification_cites_sources_and_rejects_stale_admission
          - e2e_incremental_matches_reconstruct_after_discarding_leases
        category: m011-s08
        message: "M011 e2e fixture tests missing {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/store.rs
        needles: ["JUSTIFICATIONS_REL"]
        require: all
        category: m011-s08
        message: "JUSTIFICATIONS_REL missing: {missing}"
      - kind: file_contains
        path: crates/kutha-runtime/src/admission.rs
        needles: ["conflict_report_at", "check_admission"]
        require: all
        category: m011-s08
        message: "e2e APIs missing: {missing}"

  - id: m012a-s01-log-native
    description: M012a S01 — log-native outcomes, justifications, and provenance mix
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_log_native.rs
        tests:
          - discard_outcomes_sidecar_keeps_reconstructible_disposition
          - discard_justifications_sidecar_keeps_admission_and_resume
          - provenance_fingerprint_moves_when_log_native_record_bytes_change
        category: m012a-s01
        message: "M012a S01 log-native tests missing {missing}"

  - id: m012a-s02-stable-refs
    description: M012a S02 — Retract/cite/rebuild bind minting EventId, not fold-local seq
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_stable_refs.rs
        tests:
          - retract_by_event_id_invalidates_support
          - justification_cites_source_event_ids_survive_fork
          - rebuilt_fold_renumbered_seqs_apply_same_retract_and_cite_payloads
        category: m012a-s02
        message: "M012a S02 stable-ref tests missing {missing}"

  - id: m012a-s03-idempotent-ingest
    description: M012a S03 — keyed Assert retry, claim vs support slot, stored-polarity conflict
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_idempotent_ingest.rs
        tests:
          - identical_assert_same_delivery_key_does_not_mint_second_support
          - claim_id_distinct_from_support_slot
          - conflict_report_at_partitions_by_stored_polarity
        category: m012a-s03
        message: "M012a S03 idempotent-ingest tests missing {missing}"

  - id: m012a-s04-verify-persist
    description: M012a S04 — verify-on-open, atomic events.jsonl persist on a legacy dir (no manifest; this check does not claim segmented persist), stable Define ids
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_verify_persist.rs
        tests:
          - open_rejects_tampered_snapshot
          - persist_replaces_events_jsonl_atomically
          - define_ids_stable_across_persist_open
        category: m012a-s04
        message: "M012a S04 verify-persist tests missing {missing}"

  - id: m012a-s05-time-scale
    description: M012a S05 — YearCe valid-time and log-sequence transaction-time
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_time_scale.rs
        tests:
          - fixture_years_map_to_year_ce_scale
          - transaction_time_is_log_sequence
        category: m012a-s05
        message: "M012a S05 time-scale tests missing {missing}"

  - id: m012a-s06-hot-indexes
    description: M012a S06 — fold-internal hot as_of / claim_supported_at, droppable CSR, Materializer-wired csr_lease_at
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012a_hot_indexes.rs
        tests:
          - as_of_and_claim_supported_at_skip_non_overlapping_facts
          - discard_csr_lease_and_snapshot_rebuild_keeps_as_of
          - csr_lease_at_builds_via_materializer
        category: m012a-s06
        message: "M012a S06 hot-index tests missing {missing}"

  - id: m012-s01-allowlist-facts
    description: M012 S01 — relation allowlist entries as versioned log facts; admit consults the fold cut
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_allowlist_facts.rs
        tests:
          - allow_relation_appends_as_log_fact
          - retract_allow_relation_drops_admit_at_later_cut
          - admit_consults_fold_allowlist_not_yaml_alone
        category: m012-s01
        message: "M012 S01 allowlist-as-facts tests missing {missing}"

  - id: m012-s02-rule-registry
    description: M012 S02 — rule registry as hashed log facts; unknown and free-string pins fail closed
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_rule_registry.rs
        tests:
          - register_rule_pins_behavior_to_definition_hash
          - unknown_or_mismatched_rule_version_fails_closed
          - free_string_rule_version_does_not_append
        category: m012-s02
        message: "M012 S02 rule-registry tests missing {missing}"

  - id: m012-s03-admission-facts
    description: M012 S03 — admission status and policy version as log meta-facts
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_admission_facts.rs
        tests:
          - admission_status_queryable_as_of_cut
          - admission_cites_pinned_policy_version
          - record_justification_invokes_check_admission
        category: m012-s03
        message: "M012 S03 admission-facts tests missing {missing}"

  - id: m012-s04-action-record
    description: M012 S04 — thin Action record binds args to admission and policy
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_action_record.rs
        tests:
          - action_binds_args_to_admission_and_policy
          - action_and_admission_as_of_prior_cut_after_policy_change
        category: m012-s04
        message: "M012 S04 action-record tests missing {missing}"

  - id: m012-s05-multi-hop
    description: M012 S05 — two-hop derivation eligibility is not one-hop-only
    steps:
      - kind: rust_test_asserts
        path: crates/kutha-runtime/tests/m012_multi_hop.rs
        tests:
          - two_hop_derivation_eligible_when_chain_live
          - two_hop_ineligible_when_root_assert_retracted
          - inverse_knows_cascade_is_residual_spike
        category: m012-s05
        message: "M012 S05 multi-hop tests missing {missing}"

  - id: h4-lease
    description: H5 dogfood is closed without promoting ADR-090
    steps:
      - kind: file_contains
        path: .kutha/STATE.md
        needles: ["**Phase:** H5"]
        require: all
        category: h4-lease
        message: "STATE missing H5 phase: {missing}"
      - kind: file_contains
        path: .kutha/ROADMAP.md
        needles: ["- [x] **H4**"]
        require: all
        category: h4-lease
        message: "ROADMAP H4 checkbox not marked: {missing}"
      - kind: file_contains
        path: .kutha/ROADMAP.md
        needles: ["- [x] **H5**"]
        require: all
        category: h4-lease
        message: "ROADMAP H5 checkbox not marked done: {missing}"
      - kind: file_contains
        path: .kutha/dictionaries/honeycomb.yaml
        needles: ["delivery: frozen", "full ADR-090 ontology"]
        require: all
        category: h4-lease
        message: "ADR-090 ontology freeze missing from honeycomb: {missing}"

  - id: unnamed-csr
    description: no silent CSR “now” — callers must use csr_lease_at
    steps:
      - kind: file_absent
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["pub fn csr_lease("]
        category: unnamed-now
        message: "csr_lease() is an unnamed now; use csr_lease_at(tt, vt)"

  - id: relation-allowlist
    description: FF6 stub — one relation dictionary, fail-closed writes
    steps:
      - kind: file_exists
