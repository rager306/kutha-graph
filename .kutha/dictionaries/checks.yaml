schema: kutha-harness-checks/v1
meta_prompt: .kutha/META.md
# Dictionary of governor checks. Append a row to add a check.
# Kinds: see .kutha/META.md. Unknown kind → HIGH (fail-closed).

checks:
  - id: trajectory
    description: exactly one Active Milestone, and it exists on ROADMAP
    steps:
      - kind: file_exists
        path: .kutha/STATE.md
        stop_on_fail: true
      - kind: file_exists
        path: .kutha/ROADMAP.md
        stop_on_fail: true
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*(?P<id>M\d+|None)\s*$'
        flags: [multiline]
        other: .kutha/ROADMAP.md
        skip_values: ["None"]
        inflation_pattern: '\bM\d{3}\b'
        inflation_max: 12
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Slice:\*\*\s*(?P<id>S\d+|None)\s*$'
        flags: [multiline]
        other: .kutha/ROADMAP.md
        skip_values: ["None"]
        label: Active Slice

  - id: lifecycles
    description: STATE names three orthogonal lifecycles
    steps:
      - kind: file_contains
        path: .kutha/STATE.md
        needles: ["L_map=", "L_delivery=", "L_capability="]
        require: all
        category: collapse
        message: "STATE missing lifecycle rows: {missing}"
      - kind: file_absent
        path: .kutha/STATE.md
        needles: ["L_delivery=L_capability", "governor green = product"]
        case: lower
        category: collapse
        message: "STATE collapses delivery into capability"

  - id: adr-status
    description: every docs/ADR/ADR-*.md has a known Status tag
    steps:
      - kind: markdown_heading_tag
        glob: docs/ADR/ADR-*.md
        heading: "## Status"
        allowed: [Research, Proposed, Accepted, Deprecated, Superseded]
        forbid_accepted_prefix: "ADR-0"
        forbid_accepted_not_prefix: "ADR-00"

  - id: freeze
    description: Cargo.toml members do not add frozen product deps
    steps:
      - kind: glob_absent
        glob: crates/*/Cargo.toml
        needles: [rocksdb, neo4j, graphiti, hnswlib, falkordb]
        case: lower
        category: frozen-dep
        message: "found {needle} before M001 L_capability is green"

  - id: honeycomb-map
    description: STATE/ROADMAP do not treat honeycomb as the active backlog
    steps:
      - kind: concat_absent
        paths: [.kutha/STATE.md, .kutha/ROADMAP.md]
        needles:
          - "implement all adr-010"
          - "implement all honeycomb"
          - "promote all honeycomb"
          - "active milestone:** honeycomb"
          - "active milestone: honeycomb"
        case: lower
        category: backlog
        message: "harness text treats the map as work: {needle}"
      - kind: concat_contains_any
        paths: [.kutha/ROADMAP.md]
        needles: ["map, not this list", "is a **map**"]
        case: lower
        severity: low
        category: legend
        message: "ROADMAP should say honeycomb is a map, not the delivery list"

  - id: dogfood
    description: docs/process/kutha-harness.md names H0-H4 and non-authority
    steps:
      - kind: file_exists
        path: docs/process/kutha-harness.md
        stop_on_fail: true
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles: ["**H0**", "**H1**", "**H2**", "**H3**", "**H4**"]
        require: all
        category: ladder
        message: "dogfood ladder missing rungs: {missing}"
      - kind: file_contains
        path: docs/process/kutha-harness.md
        needles: ["not an ADR"]
        case: lower
        severity: low
        category: authority
        message: "harness doc should state it is not an ADR"
      - kind: file_absent
        path: crates/kutha-runtime/src/lib.rs
        needles: ["kutha_gov"]
        category: plane-mix
        message: "kutha-runtime must not import the harness"
      - kind: glob_none
        glob: "**/*.egg-info/*"
        category: build-artifact
        message: "setuptools egg-info must not be in the tree: {path}"

  - id: observe-required-fn
    description: FSM observe_cargo required names exist as Rust tests (static, not SoT)
    steps:
      - kind: yaml_needles_in_glob
        path: .kutha/dictionaries/fsm.yaml
        select: states.observe_cargo.required
        glob: "crates/**/*.rs"
        prefix: "fn "
        category: observe-fn
        message: "FSM required names missing as fn in crates: {missing}"

  - id: plane-mix-dicts
    description: process and product relation dictionaries keep distinct schemas
    steps:
      - kind: file_absent
        path: .kutha/dictionaries/relations.yaml
        needles: ["kutha-relations/v1", "inForceAs"]
        category: plane-mix
        message: "process allowlist must not carry product schema/relations: {needle}"
      - kind: file_absent
        path: crates/kutha-runtime/dictionaries/relations.yaml
        needles: ["kutha-harness-relations/v1"]
        category: plane-mix
        message: "product allowlist must not carry process schema: {needle}"

  - id: tenant-bin
    description: emit_tenant runs a built binary, not a second cargo compile
    steps:
      - kind: file_absent
        path: .kutha/dictionaries/fsm.yaml
        needles: ['"run", "--offline"', "cargo run"]
        category: second-compile
        message: "emit_tenant must not cargo run (second compile): {needle}"
      - kind: file_absent
        path: scripts/kutha_gov/tenant.py
        needles: ["cargo run", '"run", "--offline"']
        category: second-compile
        message: "tenant interpreter must not cargo run: {needle}"
      - kind: file_contains
        path: .kutha/dictionaries/fsm.yaml
        needles: ["build:", "kutha-tenant"]
        require: all
        category: second-compile
        message: "observe_cargo must build kutha-tenant once: {missing}"

  - id: harness-relations
    description: H3 process allowlist — one list, fail-closed JSONL writes
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/relations.yaml
      - kind: file_contains
        path: .kutha/dictionaries/relations.yaml
        needles: ["schema: kutha-harness-relations/v1", "status", "high", "low", "checks", "cargo", "tenant"]
        require: all
        category: process-allowlist
        message: "process relation dictionary missing {missing}"

  - id: unnamed-csr
    description: no silent CSR “now” — callers must use csr_lease_at
    steps:
      - kind: file_absent
        path: crates/kutha-runtime/src/quantum.rs
        needles: ["pub fn csr_lease("]
        category: unnamed-now
        message: "csr_lease() is an unnamed now; use csr_lease_at(tt, vt)"

  - id: relation-allowlist
    description: FF6 stub — one relation dictionary, fail-closed writes
    steps:
      - kind: file_exists
        path: crates/kutha-runtime/dictionaries/relations.yaml
      - kind: file_contains
        path: crates/kutha-runtime/dictionaries/relations.yaml
        needles: ["schema: kutha-relations/v1", "inForceAs", "knows", "knownBy", "runStatus", "observed"]
        require: all
        category: allowlist
        message: "relation dictionary missing {missing}"

  - id: toolchain
    description: harness is Python >=3.13 under uv with ruff+ty+pyrefly
    steps:
      - kind: file_equals
        path: .python-version
        equals: "3.13"
        category: python-pin
        message: ".python-version must be 3.13, found {found!r}"
      - kind: file_exists
        path: .env.example
      - kind: file_contains
        path: .env.example
        needles: ["KUTHA_GOV_BUDGET=", "KUTHA_GOV_FAIL_ON_WARN=", "KUTHA_MAX_CASCADE=", "KUTHA_GOV_CARGO_TIMEOUT_SEC=", "KUTHA_TENANT_DIR=", "KUTHA_HARNESS_LOG=", "KUTHA_TENANT_TIMEOUT_SEC=", "KUTHA_HARNESS_RELATIONS_PATH=", "KUTHA_TENANT_BIN="]
        require: all
        category: env
        message: ".env.example missing harness settings: {missing}"
      - kind: file_contains
        path: pyproject.toml
        needles:
          - 'requires-python = ">=3.13"'
          - "[tool.uv]"
          - "ruff>="
          - "ty>="
          - "pyrefly>="
          - "[tool.ty"
          - "[tool.pyrefly]"
        require: all
        category: toolchain
        message: "pyproject.toml missing toolchain pins (uv / ruff / ty / pyrefly)"

  - id: meta-prompt
    description: constitution and dictionary exist; META lists fail-closed unknown kinds
    steps:
      - kind: file_exists
        path: .kutha/META.md
      - kind: file_exists
        path: .kutha/dictionaries/checks.yaml
      - kind: file_exists
        path: .kutha/dictionaries/fsm.yaml
      - kind: file_exists
        path: .kutha/dictionaries/relations.yaml
      - kind: file_exists
        path: .kutha/dictionaries/invariants.yaml
      - kind: file_exists
        path: .kutha/dictionaries/bridges.yaml
      - kind: file_contains
        path: .kutha/META.md
        needles:
          - "Unknown `kind`"
          - "file_exists"
          - "pointer_in_other_file"
          - "Do not add `scripts/kutha_gov/checks/*.py`"
          - "unknown-fsm-kind"
          - "require_file"
          - "glob_none"
          - "observe_cargo"
          - "emit_tenant"
          - "yaml_needles_in_glob"
          - "git_path_implies"
          - "yaml_map_list"
          - "invariants.yaml"
          - "bridges.yaml"
          - "kutha-harness-relations/v1"
          - "plane-mix"
        require: all
        category: constitution
        message: "META.md missing constitution clauses"

  - id: docs-entry
    description: human and Claude Code entry files exist and CLAUDE.md shims AGENTS.md
    steps:
      - kind: file_exists
        path: README.md
        stop_on_fail: true
      - kind: file_exists
        path: CLAUDE.md
        stop_on_fail: true
      - kind: file_contains
        path: CLAUDE.md
        needles: ["@AGENTS.md"]
        require: all
        category: entry
        message: "CLAUDE.md must shim AGENTS.md"

  - id: state-readme
    description: README shows the same Active Milestone and Phase as STATE
    steps:
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Active Milestone:\*\*\s*(?P<id>M\d+|None)\s*$'
        flags: [multiline]
        other: README.md
        skip_values: ["None"]
        label: Active Milestone
      - kind: pointer_in_other_file
        path: .kutha/STATE.md
        pattern: '^\*\*Phase:\*\*\s*(?P<id>H\d+|None)\s*$'
        flags: [multiline]
        other: README.md
        skip_values: ["None"]
        label: Phase

  - id: version-freeze
    description: research-stage versions stay 0.0.0 until STATE names a release
    steps:
      - kind: file_contains
        path: Cargo.toml
        needles: ['version = "0.0.0"']
        require: all
        category: version-freeze
        message: "workspace version must stay 0.0.0 until STATE names a release"
      - kind: file_contains
        path: pyproject.toml
        needles: ['version = "0.0.0"']
        require: all
        category: version-freeze
        message: "harness version must stay 0.0.0 until STATE names a release"
      - kind: file_absent
        path: Cargo.toml
        needles: ["publish = true"]
        category: version-freeze
        message: "crates stay publish = false at 0.0.0"

  - id: changelog-planes
    description: CHANGELOG keeps product/process/Trajectory distinct and is not a GitHub Release
    steps:
      - kind: file_exists
        path: CHANGELOG.md
        stop_on_fail: true
      - kind: file_contains
        path: CHANGELOG.md
        needles: ["not GitHub Releases", "product", "process", "Trajectory"]
        require: all
        category: changelog-planes
        message: "CHANGELOG.md missing plane legend: {missing}"

  - id: docs-coupling
    description: plane-bearing git diffs must include the owning docs (pre-commit / auto worktree)
    steps:
      - kind: git_path_implies
        when_any: ["crates/**/*.rs"]
        then_any: ["CHANGELOG.md"]
        message: "product crate diff without CHANGELOG.md (product plane)"
      - kind: git_path_implies
        when_any:
          - "scripts/kutha_gov/**"
          - "scripts/tests/**"
          - ".kutha/dictionaries/**"
          - ".kutha/META.md"
          - "docs/process/**"
        then_any: ["CHANGELOG.md"]
        message: "harness diff without CHANGELOG.md (process plane)"
      - kind: git_path_implies
        when_any: ["docs/ADR/**/*.md"]
        then_any: ["CHANGELOG.md"]
        message: "ADR diff without CHANGELOG.md (L_map / Trajectory)"
      - kind: git_path_implies
        when_any: [".kutha/STATE.md"]
        then_any: ["README.md"]
        message: "STATE.md diff without README.md (human lease table)"
      - kind: git_path_implies
        when_any: [".kutha/dictionaries/checks.yaml"]
        then_any:
          - ".kutha/dictionaries/invariants.yaml"
          - ".kutha/dictionaries/bridges.yaml"
        message: "checks.yaml diff without invariants.yaml or bridges.yaml (control loop / bridge ledger)"

  - id: invariants-ledger
    description: control-loop claims get an explicit process disposition; not a Kutha requirements catalog
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/invariants.yaml
        stop_on_fail: true
      - kind: file_exists
        path: docs/process/governor-intake.md
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/invariants.yaml
        needles:
          - "schema: kutha-harness-invariants/v1"
          - "disposition: check"
          - "disposition: deferred"
        require: all
        category: intake
        message: "invariants.yaml missing schema or control-loop disposition vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/invariants.yaml
        needles:
          - "disposition: capability"
          - "disposition: map-only"
          - "docs/ADR/ADR-"
        category: intake
        message: "invariants.yaml copied L_map/L_capability into the control loop: {needle}"
      - kind: file_contains
        path: docs/process/governor-intake.md
        needles:
          - "Silence is not a requirement"
          - "disposition: check"
          - "Do not add `scripts/kutha_gov/checks/*.py`"
          - "Bridges may cite"
          - "control loop"
          - "Kutha requirements stay"
        require: all
        category: intake
        message: "governor-intake.md missing protocol clauses: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        require_fields: [id, claim, source, disposition]
        message: "invariants.yaml rows missing id/claim/source/disposition: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        unique: id
        message: "invariants.yaml duplicate id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        field: disposition
        allowed: [check, kind, deferred]
        message: "invariants.yaml unknown disposition: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        require_fields: [check]
        message: "disposition=check rows missing check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        unique: check
        message: "disposition=check rows share a check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: deferred
        require_fields: [until]
        message: "disposition=deferred rows missing until: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: kind
        require_fields: [kind]
        message: "disposition=kind rows missing kind name: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        field: check
        other: .kutha/dictionaries/checks.yaml
        prefix: "  - id: "
        message: "control-loop check ids missing from checks.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/invariants.yaml
        select: invariants
        when:
          disposition: check
        field: check
        other: .kutha/dictionaries/bridges.yaml
        prefix: "    check: "
        absent_other: true
        message: "control-loop check ids also listed as bridges: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/checks.yaml
        select: checks
        field: id
        other:
          - .kutha/dictionaries/invariants.yaml
          - .kutha/dictionaries/bridges.yaml
        prefix: "    check: "
        message: "checks.yaml ids missing a control-loop or bridge ledger row: {missing}"

  - id: bridges-ledger
    description: bridges cite product freeze or tests; they do not copy Kutha requirements into the harness
    steps:
      - kind: file_exists
        path: .kutha/dictionaries/bridges.yaml
        stop_on_fail: true
      - kind: file_contains
        path: .kutha/dictionaries/bridges.yaml
        needles:
          - "schema: kutha-harness-bridges/v1"
          - "cites:"
        require: all
        category: bridge
        message: "bridges.yaml missing schema or cites vocab: {missing}"
      - kind: file_absent
        path: .kutha/dictionaries/bridges.yaml
        needles:
          - "disposition:"
          - "disposition: map-only"
          - "disposition: capability"
        category: bridge
        message: "bridges.yaml copied control-loop dispositions: {needle}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        require_fields: [id, claim, cites, check]
        message: "bridges.yaml rows missing id/claim/cites/check: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        unique: id
        message: "bridges.yaml duplicate id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        unique: check
        message: "bridges.yaml duplicate check id: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        field: check
        other: .kutha/dictionaries/checks.yaml
        prefix: "  - id: "
        message: "bridge check ids missing from checks.yaml: {missing}"
      - kind: yaml_map_list
        path: .kutha/dictionaries/bridges.yaml
        select: bridges
        field: check
        other: .kutha/dictionaries/invariants.yaml
        prefix: "    check: "
        absent_other: true
        message: "bridge check ids also listed in the control-loop ledger: {missing}"
