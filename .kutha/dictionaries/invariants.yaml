    disposition: deferred
    until: "STATE names a legal pack"

  # I-F1…I-F8 record product gaps from the semantic-gap review. They are not
  # enforced. No crate symbols as commitments. until names the unleased target.
  - id: I-F1-outcomes
    claim: "Product outcomes, justifications, and resume are log records, not authoritative sidecars beside the log"
