    disposition: check
    check: budget-template-align

  - id: I-budget-covers-checks
    claim: "fsm.yaml defaults.budget is at least the dictionary check count"
    source: "docs/process/kutha-harness.md"
    disposition: check
    check: budget-covers-checks

  - id: I-env-budget-floor
    claim: "when KUTHA_GOV_BUDGET is set it is at least fsm.yaml defaults.budget"
