schema: kutha-harness-invariants/v1
# 2026-09-30: Active Milestone ids may use letter suffix (M012a).
meta_prompt: .kutha/META.md
process: docs/process/governor-intake.md
# Control-loop claims the governor may enforce.
# Vacuity selftest (SEM-01) is declared on checks.yaml rows, not as dispositions here.
# Skip reasons name the live git diff; every non-derivable kind (pointer_in_other_file, when_match_then_match,
# markdown_heading_tag, yaml_needles_in_glob) declares explicit mutations instead of skipping.
# rust_test_asserts (SEM-02) proves named #[test] bodies assert; it does not Accept honeycomb cells.
# Not Kutha product requirements. Honeycomb cells stay in docs/ADR/.
# Silence is not a disposition. New control-loop check = row here first, then checks.yaml.
# Bridges that cite product live in bridges.yaml, not here.

invariants:
  - id: I-trajectory
    claim: "Active Milestone is None or a ROADMAP M### id; Active Slice is None or an unchecked ROADMAP S## id; ROADMAP must not say ACTIVE while the milestone is None"
    source: ".kutha/STATE.md"
    disposition: check
    check: trajectory

  - id: I-lifecycles
    claim: "L_map, L_delivery, and L_capability stay named and uncollapsed"
    source: ".kutha/STATE.md"
    disposition: check
    check: lifecycles

  - id: I-adr-status
    claim: "Every honeycomb ADR has a known Status tag; honeycomb is not bulk-Accepted"
    source: "docs/ADR/README.md"
    disposition: check
    check: adr-status

  - id: I-honeycomb-map
    claim: "STATE/ROADMAP do not treat honeycomb as the active delivery backlog"
    source: "docs/ADR/README.md"
    disposition: check
    check: honeycomb-map

  - id: I-dogfood
    claim: "Harness doc names H0–H5, is not an ADR, and CutPort lists observe-built migrate-bin (debug/kutha-migrate)"
    source: "docs/process/kutha-harness.md"
    disposition: check
    check: dogfood

  - id: I-plane-mix-dicts
    claim: "Process and product relation dictionaries keep distinct schemas"
    source: "docs/process/kutha-harness.md"
    disposition: check
    check: plane-mix-dicts

  - id: I-tenant-bin
    claim: "observe_cargo builds kutha-tenant and kutha-migrate once; emit_tenant runs the built kutha-tenant binary, not a second cargo compile"
    source: "docs/process/kutha-harness.md"
    disposition: check
    check: tenant-bin

  - id: I-harness-relations
    claim: "Process JSONL writes are fail-closed against the harness relation list"
    source: ".kutha/dictionaries/relations.yaml"
    disposition: check
    check: harness-relations

  - id: I-toolchain
    claim: "Harness is Python >=3.13 under uv with ruff+ty+pyrefly; .env.example documents observe-built debug/kutha-migrate and optional KUTHA_MIGRATE_DIR"
    source: "pyproject.toml"
    disposition: check
    check: toolchain

  - id: I-meta-prompt
    claim: "Constitution and dictionaries exist; unknown kind is HIGH"
    source: ".kutha/META.md"
    disposition: check
    check: meta-prompt

  - id: I-docs-entry
    claim: "README and CLAUDE.md exist; CLAUDE shims AGENTS.md"
    source: "AGENTS.md"
    disposition: check
    check: docs-entry

  - id: I-state-readme
    claim: "README shows the same Active Milestone and Phase as STATE (selftest mutates Phase when Milestone is None)"
    source: ".kutha/STATE.md"
    disposition: check
    check: state-readme

  - id: I-idle-delivery-closed
    claim: "Active Milestone None requires L_delivery token ending in -closed (selftest breaks *-closed at idle)"
    source: ".kutha/STATE.md"
    disposition: check
    check: idle-delivery-closed

  - id: I-version-freeze
    claim: "Cargo and pyproject stay 0.0.0; publish = true is forbidden"
    source: ".kutha/STATE.md"
    disposition: check
    check: version-freeze

  - id: I-changelog-planes
    claim: "CHANGELOG is plane-dated history, not GitHub Releases"
    source: "CHANGELOG.md"
    disposition: check
    check: changelog-planes

  - id: I-docs-coupling
    claim: "Plane-bearing git diffs include the owning docs (STATE lease diffs must include ROADMAP)"
    source: "docs/process/kutha-harness.md"
    disposition: check
    check: docs-coupling

  - id: I-disk-free
    claim: "Heavy ci/cargo refuses to start when free disk is below dictionary min_free_gib"
    source: "docs/process/governor-intake.md"
    disposition: check
    check: disk-free

  - id: I-budget-template-align
    claim: ".env.example KUTHA_GOV_BUDGET equals fsm.yaml defaults.budget"
