    check: i-f6-persist-open

  - id: I-F7-time-scale
    claim: "Five legal clocks (promulgation / effective / application / edition) remain beyond YearCe + LogSequence + Wall"
    source: docs/architecture/semantic-gap-review.md
    disposition: deferred
    until: "FIXG-01 C01 decision"

  - id: I-F8-hot-reads
    claim: "Hot reads use fold-internal indexes and a materializer lease on the CSR path, with a benchmark baseline and a fork-diff half, not an undeclared linear scan of the fact vector"
    source: docs/architecture/semantic-gap-review.md
    disposition: deferred
    until: "remaining fork-diff (typed CSR still from_fold)"

  # I-F9…I-F16 record post-M012 gaps (semantic-gap-review addenda). Rows with
  # disposition deferred are not enforced; restaged check rows are. until names
  # the residual, not a closed milestone. None is Accepted by this ledger.
  - id: I-F9-policy-semantics
    claim: "A pinned policy or rule definition is executed by admission and derivation; identity without evaluation does not close the gap"
    source: docs/architecture/semantic-gap-review.md
    disposition: check
    check: i-f9-policy-semantics

  - id: I-F10-genesis
    claim: "The log owns relation admission from its first event; a seeded relation can be retracted; no file is consulted at admit time"
    source: docs/architecture/semantic-gap-review.md
    disposition: check
    check: i-f10-genesis

  - id: I-F11-one-write-path
