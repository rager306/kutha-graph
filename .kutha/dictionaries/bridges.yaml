schema: kutha-harness-bridges/v1
meta_prompt: .kutha/META.md
process: docs/process/governor-intake.md
# Process checks that cite product freeze or named tests.
# Bridges may cite; they may not copy L_map or L_capability state machines.
# Kutha requirements stay in ADRs, STATE freeze, and crates tests.

bridges:
  - id: B-freeze-deps
    claim: "Cargo members do not add frozen product deps before STATE names them"
    cites: ".kutha/STATE.md"
    check: freeze

  - id: B-observe-required-fn
    claim: "FSM observe_cargo.required names exist as fn in crates"
    cites: "crates/kutha-runtime"
    check: observe-required-fn

  - id: B-unnamed-csr
    claim: "No silent CSR now; callers use csr_lease_at"
    cites: "crates/kutha-runtime"
    check: unnamed-csr

  - id: B-relation-allowlist
    claim: "Product writes stay on one FF6 relation dictionary"
    cites: "crates/kutha-runtime/dictionaries/relations.yaml"
    check: relation-allowlist

  - id: B-h4-membership-as-of
    claim: "Process-relations membership editions are queryable AS OF a prior tenant cut"
    cites: "crates/kutha-runtime/tests/h4_process_allows.rs"
    check: h4-membership-as-of

  - id: B-m010-semantic-open
    claim: "store::open recovers meanings without snapshot; live intern appends Op::Define"
    cites: "crates/kutha-runtime/tests/m010_semantic_open.rs"
    check: m010-semantic-open

  - id: B-m011-claim-supports
    claim: "Independent supports share claim_id; unknown claim and dangling caused_by fail closed; thin P→Q eligibility tracks premise supports"
    cites: "crates/kutha-runtime/tests/m011_claim_supports.rs"
    check: m011-claim-supports

  - id: B-m011-partial-correction
    claim: "Interval patch leaves VT 2012/2021 residuals; whole-version Correct does not invent them"
    cites: "crates/kutha-runtime/tests/m011_partial_correction.rs"
    check: m011-partial-correction

  - id: B-m011-quantum-outcome
    claim: "Budgets 0/1/2 distinguish Zero/Partial/Full after persist→open; crash after prefix has no terminal success until explicit resume"
    cites: "crates/kutha-runtime/tests/m011_quantum_outcome.rs"
    check: m011-quantum-outcome

  - id: B-m011-typed-csr
    claim: "Typed CSR lease preserves relation labels and support multiplicity; untyped neighbor-set and FF5 path still hold"
    cites: "crates/kutha-runtime/tests/m011_typed_csr.rs"
    check: m011-typed-csr

  - id: B-m011-provenance
    claim: "Provenance digest detects caused_by swap and rule_version change while state fold fingerprint still matches; replay_check stays Ok on valid priors"
    cites: "crates/kutha-runtime/tests/m011_provenance.rs"
    check: m011-provenance
