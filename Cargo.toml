[workspace]
resolver = "2"
members = ["crates/kutha-common", "crates/kutha-runtime"]

[workspace.package]
# Release id is N.N.NN in VERSION (0.0.01). Cargo rejects a leading zero.
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
rustc-hash = "2"
smallvec = "1"
kutha-common = { path = "crates/kutha-common" }

# Profile tuning synced with kache + mold (2026-10-10):
# - non-workspace deps without DWARF: smaller target/ across tmp/ mutation copies.
#   package."*" does not apply to workspace members (kutha-common / kutha-runtime).
# - incremental = false for deps is a no-op under kache (it strips incremental
#   anyway) but states intent for hosts still on sccache.
[profile.dev]
debug = "line-tables-only" # backtraces keep file:line; no full DWARF

[profile.dev.package."*"]
debug = false
incremental = false

[profile.release]
lto = "thin"
strip = true
