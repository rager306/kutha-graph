[workspace]
resolver = "2"
members = ["crates/kutha-common", "crates/kutha-runtime"]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
kutha-common = { path = "crates/kutha-common" }
