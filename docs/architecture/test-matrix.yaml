schema: kutha-test-matrix/v1
adr: ADR-023
# Map of oracles, not a coverage number. Governor green on test-matrix means
# named oracles exist and statuses are internally consistent — not "the product
# is tested". Do not mark killed unless the test exists and a mutation is recorded.
rows:
  # --- M002 / persist durability (audit-code-tests §2) ---
  - id: DUR-sidecar-atomic
    plane: product
    invariant: Atomic sidecar tmp+rename (legacy jsonl path)
    layer: crash
    oracle:
      - persist_replaces_events_jsonl_atomically
      - abort_snapshot_replace_keeps_previous_bytes
      - abort_wal_replace_keeps_previous_bytes
    kill_mutation: abort-before-rename truncates dest (previous dest bytes must remain)
    status: killed
    gate: default
    owner: M012a-S04
    source: audit-code-tests §2
  - id: DUR-dir-fsync
    plane: product
    invariant: Parent-dir fsync after sidecar/manifest rename
    layer: crash
    oracle:
      - persist_leaves_no_tmp_files
      - rollover_manifest_flip_fsyncs_dir
    kill_mutation: skip final sync_dir after rename
    status: killed
    gate: default
    owner: M002-S02
    source: audit-code-tests §2
  - id: DUR-committed-prefix
    plane: product
    invariant: Uncommitted suffix is hidden on open
    layer: decision
    oracle:
      - payload_without_outcome_is_not_visible
      - product_assert_without_any_outcome_is_hidden
      - horn_followon_quantum_is_atomic
    kill_mutation: hydrate the uncommitted suffix
    status: killed
    gate: default
    owner: M002-S05
    source: audit-code-tests §2
  - id: DUR-tail-guard
    plane: product
    invariant: Tail guard rejects length or last-record mismatch
    layer: crash
    oracle:
      - tail_guard_length_mismatch_writes_nothing
      - tail_guard_last_id_mismatch_writes_nothing
      - tail_guard_same_length_different_last_record_writes_nothing
      - append_tail_guard_mismatch_fails_closed_without_writing
      - append_tail_guard_rejects_truncated_or_garbage_logs
      - append_tail_guard_rejects_same_length_last_record_swap
    kill_mutation: append after a same-length last-frame swap
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-chain-verify
    plane: product
    invariant: Sealed-segment hash chain fails closed on flip
    layer: crash
    oracle:
      - writer_flipped_manifest_chain_hex_is_invalid_data
      - writer_flipped_sealed_frame_payload_is_invalid_data
      - writer_flipped_sealed_trailer_is_invalid_data
    kill_mutation: flip a sealed frame or manifest chain hex
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-manifest-flip
    plane: product
    invariant: Rollover crash reopens to the durable prefix
    layer: crash
    oracle:
      - rollover_crash_matrix_reopens_to_prefix
      - rollover_manifest_flip_fsyncs_dir
    kill_mutation: crash mid-rollover and accept a torn manifest
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-torn-active
    plane: product
    invariant: Partial bytes on the active tail are dropped
    layer: crash
    oracle:
      - torn_active_tail_dropped
      - writer_torn_active_tail_is_dropped
    kill_mutation: keep a mid-frame torn active tail
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-sealed-truncate
    plane: product
    invariant: Sealed truncate at a frame boundary is InvalidData
    layer: crash
    oracle:
      - writer_truncated_sealed_at_frame_boundary_is_invalid_data
    kill_mutation: accept a sealed file truncated on a frame boundary
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-missing-active
    plane: product
    invariant: Missing active segment is InvalidData
    layer: crash
    oracle:
      - missing_active_segment_is_invalid_data
    kill_mutation: open when manifest.active path is absent
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-migrate
    plane: product
    invariant: migrate preserves ids and fold fingerprint; crash/verify fail closed
    layer: crash
    oracle:
      - migrate_preserves_ids_and_fold_fingerprint
      - migrate_crash_matrix_reopens_without_loss
      - migrate_verify_fault_returns_invalid_data_and_keeps_legacy
    kill_mutation: drop events or keep a half-migrated manifest
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-export-jsonl
    plane: product
    invariant: export_jsonl round-trips and is never read on open
    layer: decision
    oracle:
      - export_jsonl_roundtrips_and_is_never_read_on_open
    kill_mutation: load exported jsonl as SoT on open
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-rocks-rebuild
    plane: product
    invariant: Stale Rocks index is rebuilt; catch-up indexes only the tail
    layer: crash
    oracle:
      - stale_index_is_rebuilt
      - catch_up_indexes_only_the_tail
    kill_mutation: keep a stale index whose tip no longer matches
    status: killed
    gate: feature:observe_rocks
    owner: M002-S07
    source: audit-code-tests §2
  - id: DUR-sidecar-truncated
    plane: product
    invariant: Truncated sidecar opens from the log
    layer: crash
    oracle:
      - sidecar_truncated_mid_line_opens_from_log
    kill_mutation: fail closed on a truncated sidecar when the log is intact
    status: killed
    gate: default
    owner: M002-S02
    source: audit-code-tests §2
  - id: DUR-append-prefix
    plane: product
    invariant: Incremental append keeps prefix bytes of jsonl and WAL
    layer: crash
    oracle:
      - append_keeps_prefix_bytes_of_jsonl_and_wal
    kill_mutation: rewrite the prefix on a second persist
    status: killed
    gate: default
    owner: M002-S04
    source: audit-code-tests §2
  - id: DUR-empty-dir-seg
    plane: product
    invariant: persist of an empty dir writes segments, not jsonl
    layer: decision
    oracle:
      - persist_empty_dir_writes_segments_not_jsonl
    kill_mutation: write legacy jsonl for a new empty dir
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-snapshot-ahead
    plane: product
    invariant: Snapshot ahead of the committed prefix fails closed
    layer: crash
    oracle:
      - snapshot_ahead_of_committed_prefix_fails_closed
    kill_mutation: open a snapshot whose offset is past the committed prefix
    status: killed
    gate: default
    owner: M002-S05
    source: audit-code-tests §2
  - id: DUR-verify-open
    plane: product
    invariant: Tampered snapshot is rejected on open
    layer: kill
    oracle:
      - open_rejects_tampered_snapshot
    kill_mutation: accept a snapshot whose fold does not match the log
    status: killed
    gate: default
    owner: M012a-S04
    source: audit-code-tests §2

  # --- durability gaps (S05 A / S06 B) ---
  - id: DUR-checkpoint-omitted-qo
