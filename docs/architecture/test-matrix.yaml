    status: killed
    gate: feature:observe_rocks
    owner: M002-S07
    source: audit-code-tests §2
  - id: DUR-sidecar-truncated
    plane: product
    invariant: Truncated sidecar opens from the log
    layer: crash
    oracle:
      - sidecar_truncated_mid_line_opens_from_log
    kill_mutation: fail closed on a truncated sidecar when the log is intact
    status: killed
    gate: default
    owner: M002-S02
    source: audit-code-tests §2
  - id: DUR-append-prefix
    plane: product
    invariant: Incremental append keeps prefix bytes of jsonl and WAL
    layer: crash
    oracle:
      - append_keeps_prefix_bytes_of_jsonl_and_wal
    kill_mutation: rewrite the prefix on a second persist
    status: killed
    gate: default
    owner: M002-S04
    source: audit-code-tests §2
  - id: DUR-empty-dir-seg
    plane: product
    invariant: persist of an empty dir writes segments, not jsonl
    layer: decision
    oracle:
      - persist_empty_dir_writes_segments_not_jsonl
    kill_mutation: write legacy jsonl for a new empty dir
    status: killed
    gate: default
    owner: M002-S06
    source: audit-code-tests §2
  - id: DUR-snapshot-ahead
    plane: product
    invariant: Snapshot ahead of the committed prefix fails closed
    layer: crash
    oracle:
      - snapshot_ahead_of_committed_prefix_fails_closed
    kill_mutation: open a snapshot whose offset is past the committed prefix
    status: killed
    gate: default
    owner: M002-S05
    source: audit-code-tests §2
  - id: DUR-verify-open
    plane: product
    invariant: Tampered snapshot is rejected on open
    layer: kill
    oracle:
      - open_rejects_tampered_snapshot
    kill_mutation: accept a snapshot whose fold does not match the log
    status: killed
    gate: default
    owner: M012a-S04
    source: audit-code-tests §2

