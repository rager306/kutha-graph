    status: killed
    gate: default
    owner: M019-S05
    source: audit-code-tests §2 HIGH
  - id: DUR-chain-active-prev
    plane: product
    invariant: flip active header prev-hash while sealed chain stays valid
    layer: crash
    oracle:
