    layer: crash
    oracle:
      - manifest_pre_rename_second_open_keeps_prefix
    kill_mutation: treat an unnamed leftover seg-*.log as InvalidData
    status: killed
    gate: default
    owner: M019-S05
    source: audit-code-tests §2 residual
  - id: DUR-sealed-trailer-lie
    plane: product
