[package]
name = "kutha-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "In-memory event log, fold, quantum, receipts, replay (ADR-010/014/060)"

[features]
rocks-index-spike = ["dep:rocksdb"]
rocks-index = ["dep:rocksdb"]

[dependencies]
kutha-common.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
crc32fast = { workspace = true }
rustc-hash.workspace = true
smallvec.workspace = true
# default-features=false: no snappy/lz4/zstd/zlib/bzip2 (those are rocksdb defaults).
rocksdb = { version = "0.22", optional = true, default-features = false }

[dev-dependencies]
trybuild = "1.0"

[[bench]]
name = "baseline"
harness = false
